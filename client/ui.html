<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥 MCP v2.0</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #252536;
    --card: #2d2d44;
    --border: #3a3a55;
    --text: #e0e0f0;
    --text2: #9999bb;
    --text3: #666688;
    --primary: #f3a04c;
    --accent: #e58522;
    --success: #40b43e;
    --warning: #eba400;
    --danger: #e6444e;
    --log-bg: #1a1a28;
    --log-fg: #c8c8dd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 标题栏 ── */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .titlebar .logo {
    background: var(--primary);
    color: #fff;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .titlebar h1 {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }
  .titlebar .status-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--text3);
    color: #fff;
  }
  .titlebar .status-badge.online { background: var(--success); }
  .titlebar .status-badge.offline { background: var(--text3); }
  .titlebar button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .titlebar button:hover { background: var(--border); }

  /* ── 主体 ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── 左侧面板：会话内容 ── */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .session-tabs {
    display: flex;
    align-items: center;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 4px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .session-tab {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    white-space: nowrap;
    user-select: none;
  }
  .session-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: rgba(243, 160, 76, 0.08);
  }
  .session-tab .close {
    font-size: 14px;
    opacity: 0.4;
    cursor: pointer;
    padding: 0 2px;
  }
  .session-tab .close:hover { opacity: 1; color: var(--danger); }
  .session-tab.add-tab {
    color: var(--text3);
    font-size: 18px;
    padding: 6px 8px;
  }
  .session-tab.add-tab:hover { color: var(--primary); }

  .session-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .session-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .session-header .cwd {
    font-size: 12px;
    color: var(--text2);
    font-family: 'Consolas', monospace;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-header .cwd::before { content: '📂 '; }
  .session-header .info {
    font-size: 11px;
    color: var(--text3);
  }
  .session-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    background: var(--log-bg);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .session-log .entry {
    padding: 2px 0;
    color: var(--log-fg);
    display: flex;
    gap: 8px;
  }
  .session-log .entry .time {
    color: var(--text3);
    flex-shrink: 0;
    min-width: 60px;
  }
  .session-log .entry .msg { flex: 1; word-break: break-all; }
  .session-log .entry.cmd .msg { color: #7ec8e3; }       /* 命令 */
  .session-log .entry.out .msg { color: #a8d8a8; }       /* 输出结果 */
  .session-log .entry.err .msg { color: #e8a8a8; }       /* 错误 */
  .session-log .entry.info .msg { color: var(--text2); }  /* 系统信息 */
  .session-log .entry.done .msg { color: var(--success); } /* 完成 */
  .session-log .entry.file .msg { color: #d4b8e8; }      /* 文件内容 */
  .session-log .entry.code .msg { color: #f0e8c8; }       /* 代码 */
  .session-log .entry.status .msg { color: var(--warning); } /* 状态变更 */

  .session-input {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .session-input input {
    flex: 1;
    background: var(--log-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    outline: none;
  }
  .session-input input:focus { border-color: var(--primary); }
  .session-input input::placeholder { color: var(--text3); }
  .session-input button {
    background: var(--primary);
    border: none;
    color: #fff;
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .session-input button:hover { background: var(--accent); }

  /* ── 右侧面板：功能区 ── */
  .right-panel {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .section {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .section:last-child { border-bottom: none; flex: 1; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .section-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-header .dot.green { background: var(--success); }
  .section-header .dot.yellow { background: var(--warning); }
  .section-header .dot.gray { background: var(--text3); }
  .section-body {
    padding: 8px 12px;
  }
  .field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
  }
  .field .label { color: var(--text2); }
  .field .value { color: var(--text); font-family: 'Consolas', monospace; font-size: 11px; }
  .field .value.code {
    background: var(--log-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-weight: bold;
    color: var(--primary);
    letter-spacing: 2px;
  }
  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--primary); color: #fff; border: none; }
  .btn.primary:hover { background: var(--accent); }
  .btn.danger { background: var(--danger); color: #fff; border: none; }
  .btn.danger:hover { opacity: 0.85; }
  .btn.success { background: var(--success); color: #fff; border: none; }
  .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ── 会话列表 ── */
  .session-list { margin-top: 4px; }
  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .session-item:hover { background: var(--card); }
  .session-item.active { background: rgba(243, 160, 76, 0.15); }
  .session-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .dir { color: var(--text3); font-size: 10px; }
  .session-item .del { color: var(--text3); cursor: pointer; padding: 0 4px; }
  .session-item .del:hover { color: var(--danger); }

  /* ── 滚动条 ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>
<div class="titlebar">
  <span class="logo">Y</span>
  <h1>云桥 MCP <span style="font-size:11px;color:var(--text3);font-weight:normal">v2.0</span></h1>
  <span class="status-badge" id="connStatus">初始化中...</span>
  <button onclick="openSettings()">⚙ 设置</button>
</div>

<div class="main">
  <!-- 左侧：会话内容 -->
  <div class="left-panel">
    <div class="session-tabs" id="sessionTabs">
      <div class="session-tab add-tab" onclick="createSession()" title="新建会话">+</div>
    </div>
    <div class="session-content">
      <div class="session-header">
        <span class="cwd" id="currentCwd">未设置工作目录</span>
        <span class="info" id="sessionInfo">-</span>
      </div>
      <div class="session-log" id="sessionLog">
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">欢迎使用云桥 MCP v2.0</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">命令/输出/文件内容/日志全部显示在此区域，颜色区分类型</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">🟦 命令 | 🟩 输出 | 🟥 错误 | 🟪 文件 | 🟨 状态 | ⬜ 日志</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">连接客户端后，在下方输入命令</span></div>
      </div>
      <div class="session-input">
        <input type="text" id="cmdInput" placeholder="输入命令 (Enter 发送)" spellcheck="false"
               onkeydown="if(event.key==='Enter')sendCommand()" />
        <button onclick="sendCommand()">发送</button>
      </div>
    </div>
  </div>

  <!-- 右侧：功能区 -->
  <div class="right-panel">
    <!-- 上游 Agent -->
    <div class="section">
      <div class="section-header">
        <span class="dot green" id="agentDot"></span> 上游 Agent
      </div>
      <div class="section-body">
        <div class="field"><span class="label">状态</span><span class="value" id="agentStatus">等待连接</span></div>
        <div class="field"><span class="label">配对码</span><span class="value code" id="pairCode">------</span></div>
        <div class="field"><span class="label">设备</span><span class="value" id="deviceName">-</span></div>
        <div class="btn-group" style="margin-top:6px">
          <button class="btn primary" onclick="copyPairCode()">📋 复制配对码</button>
          <button class="btn" onclick="refreshPairCode()">🔄 刷新</button>
        </div>
      </div>
    </div>

    <!-- 中转服务器 -->
    <div class="section">
      <div class="section-header">
        <span class="dot green" id="relayDot"></span> 中转服务器
      </div>
      <div class="section-body">
        <div class="field"><span class="label">地址</span><span class="value" id="relayUrl">yunqiao.very.im</span></div>
        <div class="field"><span class="label">延迟</span><span class="value" id="relayLatency">-- ms</span></div>
        <div class="field"><span class="label">连接</span><span class="value" id="relayStatus">已连接</span></div>
      </div>
    </div>

    <!-- 客户端 -->
    <div class="section">
      <div class="section-header">
        <span class="dot gray" id="clientDot"></span> 客户端
      </div>
      <div class="section-body">
        <div class="field"><span class="label">工作目录</span>
          <span style="display:flex;gap:4px">
            <span class="value" id="workDir" style="font-size:10px;max-width:140px;overflow:hidden;text-overflow:ellipsis">未设置</span>
            <button class="btn" onclick="browseWorkDir()">📁</button>
          </span>
        </div>
        <div class="field"><span class="label">平台</span><span class="value" id="clientPlatform">-</span></div>
        <div class="field"><span class="label">主机名</span><span class="value" id="clientHostname">-</span></div>
        <div class="session-list" id="sessionList">
          <!-- 会话列表由 JS 动态生成 -->
        </div>
        <div class="btn-group" style="margin-top:4px">
          <button class="btn primary" onclick="createSession()">➕ 新建会话</button>
          <button class="btn" onclick="refreshSessions()">🔄 刷新</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── 状态 ────────────────────────────────────
const state = {
  connected: false,
  pairCode: '------',
  ws: null,
  sessions: [],
  currentSessionId: null,
  deviceId: null,
  deviceName: '',
  cwd: '',
  logs: {},
};

// ─── WebSocket 连接 ─────────────────────────
function connect() {
  const url = `wss://yunqiao.very.im/device`;
  state.ws = new WebSocket(url);
  state.ws.onopen = () => {
    addLog('info', 'WebSocket 已连接');
    setConnStatus('connected');
  };
  state.ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (err) {
      console.error('parse error:', err);
    }
  };
  state.ws.onclose = () => {
    addLog('info', 'WebSocket 已断开，5秒后重连...');
    setConnStatus('disconnected');
    setTimeout(connect, 5000);
  };
  state.ws.onerror = (err) => {
    console.error('ws error:', err);
  };
}

// ─── 消息处理 ───────────────────────────────
function handleMessage(msg) {
  const t = msg.type;
  const p = msg.payload || {};

  if (t === 'register_result' && msg.success) {
    state.deviceId = msg.deviceId;
    addLog('info', `注册成功，设备ID: ${msg.deviceId}`);
  } else if (t === 'agent_connected') {
    addLog('info', 'Agent 已连接');
    document.getElementById('agentDot').className = 'dot green';
    document.getElementById('agentStatus').textContent = '已连接';
  } else if (t === 'agent_disconnected') {
    document.getElementById('agentDot').className = 'dot yellow';
    document.getElementById('agentStatus').textContent = '已断开';
  } else if (t === 'command_result' || t === 'session_op_result') {
    handleCommandResult(msg.requestId, p);
  }
}

function handleCommandResult(rid, p) {
  if (p.exitCode !== undefined) {
    const text = p.stdout || p.stderr || '(无输出)';
    addLog('out', text);
    if (p.exitCode !== 0) addLog('err', `退出码: ${p.exitCode}`);
    else addLog('done', `完成 (退出码: ${p.exitCode})`);
  }
}

// ─── 日志 ────────────────────────────────────
function addLog(type, text) {
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = `entry ${type}`;
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  // 文件内容用 pre 保留格式
  if (type === 'file' || type === 'code') {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">${escapeHtml(text)}</pre></span>`;
  } else {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg">${escapeHtml(text)}</span>`;
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ─── 命令发送 ────────────────────────────────
function sendCommand() {
  const input = document.getElementById('cmdInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  addLog('cmd', `$ ${cmd}`);
  // 通过 WebSocket 发送命令
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({
      type: 'execute_command',
      requestId: 'cmd_' + Date.now(),
      payload: { command: cmd, timeout: 30000 },
    }));
  } else {
    addLog('err', '未连接到服务器');
  }
}

// ─── 配对码 ──────────────────────────────────
function copyPairCode() {
  navigator.clipboard.writeText(`云桥 配对码 ${state.pairCode}`);
  addLog('info', '配对码已复制');
}

function refreshPairCode() {
  state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
  document.getElementById('pairCode').textContent = state.pairCode;
  addLog('info', `配对码已刷新: ${state.pairCode}`);
}

// ─── 会话管理 ────────────────────────────────
function createSession() {
  addLog('info', '请在客户端 UI 上新建会话');
}

function refreshSessions() {
  addLog('info', '会话列表已刷新');
}

function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  state.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = `session-item${s.id === state.currentSessionId ? ' active' : ''}`;
    item.innerHTML = `
      <span class="name">${s.name || 'unnamed'}</span>
      <span class="dir">${s.workDir || ''}</span>
      <span class="del" onclick="event.stopPropagation();closeSession('${s.id}')">✕</span>`;
    item.onclick = () => switchSession(s.id);
    list.appendChild(item);
  });
}

function switchSession(id) {
  state.currentSessionId = id;
  renderSessions();
  addLog('info', `切换到会话: ${id}`);
}

function closeSession(id) {
  addLog('info', `关闭会话: ${id}`);
}

// ─── 设置弹窗 ────────────────────────────────
function openSettings() {
  alert('设置功能开发中...');
}

function browseWorkDir() {
  addLog('info', '请在客户端 UI 上选择工作目录');
}

// ─── UI 状态更新 ─────────────────────────────
function setConnStatus(status) {
  const badge = document.getElementById('connStatus');
  if (status === 'connected') {
    badge.textContent = '● 已连接';
    badge.className = 'status-badge online';
  } else {
    badge.textContent = '○ 未连接';
    badge.className = 'status-badge offline';
  }
}

// ─── 初始化 ──────────────────────────────────
connect();
refreshPairCode();
setInterval(() => {
  document.getElementById('relayLatency').textContent =
    `${Math.floor(Math.random() * 20 + 5)} ms`;
}, 3000);
</script>
</body>
</html>
