<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>~</text></svg>">
<title>云桥 MCP v2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        panel: { 50: '#f8f9fc', 100: '#eef0f5', 200: '#d5d8e3', 300: '#b4b8cc', 400: '#8e93b0', 500: '#6e7394', 600: '#545879', 700: '#3d4159', 800: '#282b3d', 900: '#1a1c2a', 950: '#0f101a' },
        brand: { 400: '#f0a050', 500: '#e8874a', 600: '#d46e2e' },
        accent: { 400: '#6c8cff', 500: '#5570e8', 600: '#4458cc' },
        success: { 400: '#4ade80', 500: '#22c55e' },
        danger: { 400: '#f87171', 500: '#ef4444' },
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .animate-pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  .animate-slide-up { animation: slide-up 0.2s ease; }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden" style="background: linear-gradient(135deg, #0f101a 0%, #1a1c2a 50%, #0f101a 100%);">

<!-- ─── 标题栏 ─── -->
<header class="flex items-center gap-3 px-5 py-2.5 flex-shrink-0" style="background: rgba(15,16,26,0.8); border-bottom: 1px solid rgba(255,255,255,0.06);">
  <div class="w-5 h-5 rounded flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0" style="background: linear-gradient(135deg, #5570e8, #6c8cff);">~</div>
  <span class="text-sm font-semibold text-white/90">云桥 MCP</span>
  <span class="text-xs text-white/30 font-medium">v2.0</span>
  <div class="flex-1"></div>
  <div class="w-2 h-2 rounded-full bg-white/20" id="conn状态"></div>
  <button class="text-white/30 hover:text-white/70 text-sm px-1 py-0.5 rounded transition-colors" onclick="openSettings()">⚙</button>
</header>

<!-- ─── 主体 ─── -->
<div class="flex flex-1 overflow-hidden gap-0">

  <!-- 左侧：对话/日志 -->
  <div class="flex-1 flex flex-col min-w-0" style="background: rgba(15,16,26,0.4);">

    <!-- 路径栏 -->
    <div class="flex items-center gap-2 px-5 py-2 flex-shrink-0" style="border-bottom: 1px solid rgba(255,255,255,0.04);">
      <span class="text-accent-400 text-sm font-bold">❯</span>
      <span class="text-xs font-mono text-white/35 flex-1 truncate" id="currentCwd">~</span>
    </div>

    <!-- 日志区 -->
    <div class="flex-1 overflow-y-auto px-5 py-3 font-mono text-sm leading-relaxed" id="sessionLog">
      <div class="entry info flex gap-2.5 py-0.5 animate-slide-up"><span class="text-white/20 flex-shrink-0 text-xs min-w-[56px]">--:--:--</span><span class="text-white/40">云桥 MCP v2.0</span></div>
      <div class="entry info flex gap-2.5 py-0.5 animate-slide-up"><span class="text-white/20 flex-shrink-0 text-xs min-w-[56px]">--:--:--</span><span class="text-white/40">输入命令开始操作</span></div>
    </div>

    <!-- 输入区 -->
    <div class="flex items-stretch flex-shrink-0" style="border-top: 1px solid rgba(255,255,255,0.06);">
      <span class="flex items-center pl-5 pr-0 text-accent-400 text-sm font-bold select-none">❯</span>
      <input type="text" id="cmdInput" class="flex-1 bg-transparent border-none text-white/80 px-3 py-2.5 font-mono text-sm outline-none placeholder-white/20" placeholder="输入命令..." spellcheck="false" onkeydown="if(event.key==='Enter')sendCommand()" />
    </div>
  </div>

  <!-- 右侧：状态面板 -->
  <aside class="w-64 flex flex-col gap-3 p-3 overflow-y-auto flex-shrink-0">

    <!-- Agent 卡片 -->
    <div class="rounded-xl p-4" style="background: rgba(26,28,42,0.8); border: 1px solid rgba(255,255,255,0.06);">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full bg-success-400 animate-pulse-dot"></div>
        <span class="text-xs font-semibold text-white/60 uppercase tracking-wider">上游 Agent</span>
      </div>
      <div class="space-y-1.5 text-sm">
        <div class="flex justify-between items-center"><span class="text-white/35">状态</span><span class="text-white/70" id="agent状态">待接入</span></div>
        <div class="flex justify-between items-center"><span class="text-white/35">配对码</span><span class="font-mono text-brand-400 font-bold tracking-wider text-base" id="pairCode">------</span></div>
        <div class="flex justify-between items-center"><span class="text-white/35">设备</span><span class="text-white/70 truncate max-w-[130px]" id="deviceName">-</span></div>
      </div>
      <div class="flex gap-2 mt-3 pt-3" style="border-top: 1px solid rgba(255,255,255,0.06);">
        <button class="text-xs px-3 py-1.5 rounded-lg transition-all" style="background: rgba(85,112,232,0.15); color: #6c8cff;" onclick="copyPairCode()" onmouseover="this.style.background='rgba(85,112,232,0.25)'" onmouseout="this.style.background='rgba(85,112,232,0.15)'">复制</button>
        <button class="text-xs px-3 py-1.5 rounded-lg transition-all text-white/40 hover:text-white/70" style="background: rgba(255,255,255,0.05);" onclick="refreshPairCode()" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">刷新</button>
      </div>
    </div>

    <!-- Relay 卡片 -->
    <div class="rounded-xl p-4" style="background: rgba(26,28,42,0.8); border: 1px solid rgba(255,255,255,0.06);">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full bg-success-400"></div>
        <span class="text-xs font-semibold text-white/60 uppercase tracking-wider">中转服务器</span>
      </div>
      <div class="space-y-1.5 text-sm">
        <div class="flex justify-between items-center"><span class="text-white/35">地址</span><span class="text-white/70 font-mono text-xs truncate max-w-[150px]" id="relayUrl">yunqiao.very.im</span></div>
        <div class="flex justify-between items-center"><span class="text-white/35">延迟</span><span class="text-white/70 font-mono" id="relay延迟">-- ms</span></div>
      </div>
    </div>

    <!-- Client 卡片 -->
    <div class="rounded-xl p-4 flex-1" style="background: rgba(26,28,42,0.8); border: 1px solid rgba(255,255,255,0.06);">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full bg-white/20"></div>
        <span class="text-xs font-semibold text-white/60 uppercase tracking-wider">Client</span>
      </div>
      <div class="space-y-1.5 text-sm">
        <div class="flex justify-between items-center"><span class="text-white/35">工作目录</span><span class="text-white/70 font-mono text-xs truncate max-w-[140px]" id="workDir">未设置</span></div>
        <div class="flex justify-between items-center"><span class="text-white/35">平台</span><span class="text-white/70" id="client平台">-</span></div>
        <div class="flex justify-between items-center"><span class="text-white/35">主机名</span><span class="text-white/70 truncate max-w-[130px]" id="client主机名">-</span></div>
      </div>
      <div class="mt-3 pt-3" style="border-top: 1px solid rgba(255,255,255,0.06);" id="sessionList"></div>
      <div class="flex gap-2 mt-3">
        <button class="text-xs px-3 py-1.5 rounded-lg transition-all" style="background: rgba(85,112,232,0.15); color: #6c8cff;" onclick="createSession()" onmouseover="this.style.background='rgba(85,112,232,0.25)'" onmouseout="this.style.background='rgba(85,112,232,0.15)'">+ 新建会话</button>
        <button class="text-xs px-3 py-1.5 rounded-lg transition-all text-white/40 hover:text-white/70" style="background: rgba(255,255,255,0.05);" onclick="refreshSessions()" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">↻</button>
      </div>
    </div>
  </aside>
</div>

<script>
const state = { connected: false, pairCode: '------', ws: null, sessions: [], currentSessionId: null, deviceId: null, deviceName: '', cwd: '', logs: {}, platform: '', hostname: '', workDir: '' };

function addLog(type, text) {
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = 'entry ' + type + ' flex gap-2.5 py-0.5 animate-slide-up';
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  const colors = {cmd:'text-blue-400',out:'text-green-400',err:'text-red-400',info:'text-white/40',done:'text-green-400',file:'text-purple-400',code:'text-yellow-400',status:'text-orange-400'};
  const c = colors[type] || 'text-white/70';
  if (type === 'file' || type === 'code') {
    entry.innerHTML = '<span class="text-white/20 flex-shrink-0 text-xs min-w-[56px]">' + time + '</span><span class="' + c + '"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">' + esc(text) + '</pre></span>';
  } else {
    entry.innerHTML = '<span class="text-white/20 flex-shrink-0 text-xs min-w-[56px]">' + time + '</span><span class="' + c + '">' + esc(text) + '</span>';
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function sendCommand() {
  var input = document.getElementById('cmdInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  addLog('cmd', '$ ' + text);
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'execute_command', requestId: 'cmd_' + Date.now(), payload: { command: text, timeout: 30000 } }));
    state.ws.send(JSON.stringify({ type: 'agent_message', requestId: 'msg_' + Date.now(), text: text }));
  } else {
    try { pywebview.api.api_send_command(text); } catch(e) { addLog('err', '未连接到服务器'); }
  }
}

function copyPairCode() {
  navigator.clipboard.writeText('云桥 配对码 ' + state.pairCode);
  addLog('info', '配对码已复制');
}
function refreshPairCode() {
  state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
  var el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
  addLog('info', '配对码已刷新: ' + state.pairCode);
}

function createSession() {
  var name = prompt('会话名称（可选）:', '工作区');
  if (name === null) return;
  var dir = prompt('工作目录:', state.workDir || 'C:\\Users\\Administrator');
  if (dir === null) return;
  var id = 's_' + Date.now().toString(36);
  state.sessions.push({ id: id, name: name || '工作区', workDir: dir, cwd: dir, isDefault: state.sessions.length === 0 });
  state.currentSessionId = id; state.workDir = dir;
  renderSessions(); update状态();
  addLog('info', '会话已创建: ' + name + ' (' + id + ')');
}
function connectRelay() {
  // 尝试连接中转服务器
  var url = document.getElementById('relayUrl').textContent;
  addLog('status', '正在连接中转服务器: ' + url);
  // 通过 WebSocket 重新连接
  if (state.ws) {
    try { state.ws.close(); } catch(e) {}
  }
  state.ws = new WebSocket('wss://' + url + '/device');
  state.ws.onopen = function() {
    addLog('done', '中转服务器连接成功');
    document.getElementById('relayStatus').textContent = '已连接';
    document.getElementById('relayDot').className = 'w-2 h-2 rounded-full bg-green-400';
  };
  state.ws.onclose = function() {
    addLog('info', '中转服务器连接断开');
    document.getElementById('relayStatus').textContent = '未连接';
    document.getElementById('relayDot').className = 'w-2 h-2 rounded-full bg-white/20';
  };
  state.ws.onerror = function() {
    addLog('err', '中转服务器连接失败');
  };
}
function configRelay() {
  var currentUrl = document.getElementById('relayUrl').textContent;
  var url = prompt('中转服务器地址:', currentUrl);
  if (url && url.trim()) {
    document.getElementById('relayUrl').textContent = url.trim();
    addLog('info', '中转服务器地址已更新: ' + url.trim());
  }
}
function refreshSessions() { addLog('info', '会话列表已刷新'); }
function renderSessions() {
  var list = document.getElementById('sessionList');
  list.innerHTML = '';
  state.sessions.forEach(function(s) {
    var item = document.createElement('div');
    item.className = 'flex items-center gap-1 py-1 px-1.5 rounded-lg cursor-pointer text-xs transition-all';
    item.style.cssText = (s.id === state.currentSessionId ? 'background:rgba(85,112,232,0.1);color:#6c8cff;' : 'color:rgba(255,255,255,0.4);');
    item.onmouseover = function() { if (s.id !== state.currentSessionId) this.style.background = 'rgba(255,255,255,0.05)'; };
    item.onmouseout = function() { if (s.id !== state.currentSessionId) this.style.background = 'transparent'; };
    item.innerHTML = '<span class="flex-1 truncate">' + esc(s.name || 'unnamed') + '</span><span class="text-white/20 hover:text-red-400 cursor-pointer" onclick="event.stopPropagation();closeSession(\'' + s.id + '\')">✕</span>';
    item.onclick = function() { switchSession(s.id); };
    list.appendChild(item);
  });
}
function switchSession(id) { state.currentSessionId = id; renderSessions(); addLog('info', '已切换到会话: ' + id); }
function closeSession(id) {
  if (!confirm('确定关闭此会话?')) return;
  state.sessions = state.sessions.filter(function(s) { return s.id !== id; });
  if (state.currentSessionId === id) { state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null; }
  renderSessions(); addLog('info', '会话已关闭: ' + id);
}

function update状态() {
  var el;
  el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
  el = document.getElementById('deviceName'); if (el) el.textContent = state.deviceName || '-';
  el = document.getElementById('client平台'); if (el) el.textContent = state.platform || '-';
  el = document.getElementById('client主机名'); if (el) el.textContent = state.hostname || '-';
  el = document.getElementById('workDir'); if (el) el.textContent = state.workDir || '未设置';
  el = document.getElementById('currentCwd'); if (el) el.textContent = state.workDir || '~';
}
function setConn状态(status) {
  var dot = document.getElementById('conn状态');
  dot.className = 'w-2 h-2 rounded-full ' + (status === 'connected' ? 'bg-green-400 animate-pulse-dot' : 'bg-white/20');
}

(function() {
  refreshPairCode();
  update状态();
  addLog('info', '欢迎使用云桥 MCP v2.0');
  setConn状态('disconnected');
})();
</script>
</body>
</html>
