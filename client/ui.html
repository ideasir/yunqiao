<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #0a0a0a; color: #ededed; }
  .font-mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #333333; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes blinkFast { 0%,100% { opacity: 1; } 50% { opacity: 0.1; } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes slide-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .animate-pulse { animation: pulse 2s ease-in-out infinite; }
  .blink-fast { animation: blinkFast 0.3s ease-in-out infinite; }
  .animate-slide-up { animation: slide-up 0.2s ease; }
  .hidden { display: none; }
  button:active { transform: scale(.95); }

  /* 任务队列抽屉：收起时一个小条，展开时向上延伸 */
  #taskPanel { width: 148px; max-height: 34px; overflow: hidden; transition: all .25s ease; }
  #taskPanel.expanded { width: 280px; max-height: 320px; }

  /* 日志系统（IDE 风格） */
  .lg-time { color: #666; font-family: 'JetBrains Mono', Consolas, monospace; flex-shrink: 0; min-width: 56px; }
  .lg-badge { font-size: 9px; font-family: 'JetBrains Mono', Consolas, monospace; padding: 0 4px; border-radius: 3px; border: 1px solid; flex-shrink: 0; line-height: 13px; margin-top: 1px; }
  .lg-fbtn.active { background: #222; color: #ededed; }
  .cmd-body pre { margin: 0; font-family: inherit; white-space: pre-wrap; word-break: break-all; }
  .entry { user-select: text; -webkit-user-select: text; }

  /* 自定义复选框（替代浏览器默认样式，贴合深色主题） */
  input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border: 1px solid #555; border-radius: 3px; background: #1a1a1a; cursor: pointer; position: relative; vertical-align: middle; }
  input[type="checkbox"]:hover { border-color: #888; }
  input[type="checkbox"]:checked { background: #4ade80; border-color: #4ade80; }
  input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #0a0a0a; border-width: 0 2px 2px 0; transform: rotate(45deg); }
</style>

<!-- ─── 主体 ─── -->
<div class="flex flex-1 overflow-hidden gap-0">

  <!-- 左侧侧边栏 -->
  <div class="flex flex-col items-center gap-1.5 py-2.5 px-1.5 flex-shrink-0 select-none bg-[#0d0d0d] ">
    <div class="w-7 h-7 flex items-center justify-center rounded-lg cursor-pointer text-base font-semibold text-[#888] transition-all hover:bg-[#1a1a1a] hover:text-[#ededed]" onclick="createSession()" title="新建会话">+</div>

    <div class="flex flex-col gap-1 items-center flex-1 overflow-y-auto w-full px-0.5" id="sidebarList"></div>

    <div id="ctxMenu" class="fixed z-50 rounded-lg bg-[#1a1a1a] border border-[#333] shadow-xl py-1" style="display:none; min-width:140px;">

      <button class="lg-fbtn text-[10px] px-1.5 py-0.5 rounded text-[#666] hover:text-[#ccc] transition-colors" data-f="file" onclick="setLogFilter('file')">文件</button>

      <button id="autoScrollBtn" class="text-[10px] text-[#555] hover:text-[#aaa] transition-colors bg-transparent border-0 cursor-pointer" onclick="toggleAutoScroll()" title="自动滚动到底部">⤓ 滚动</button>
      <button class="text-[10px] text-[#555] hover:text-[#aaa] transition-colors bg-transparent border-0 cursor-pointer" onclick="clearLog()" title="清空日志">清空</button>
    </div>

    <!-- 日志区 -->
    <div class="flex-1 overflow-y-auto px-4 py-2 font-mono text-xs leading-relaxed" id="sessionLog">

    </div>

    <!-- 输入区 -->
    <div class="flex items-stretch flex-shrink-0 bg-[#0a0a0a] border-t border-[#1a1a1a]">
      <span class="flex items-center pl-5 pr-1 text-[#888] text-sm font-bold select-none">❯</span>
      <input type="text" id="cmdInput" class="flex-1 bg-transparent border-none text-[#ededed] px-3 py-3 font-mono text-xs outline-none placeholder-[#666]" placeholder="给 Agent 发消息，回车发送（! 前缀 = 紧急）" spellcheck="false" onkeydown="if(event.key==='Enter')sendCommand()" />

    <div id="taskPanel" class="absolute rounded-xl bg-[#141414] border border-[#222222] shadow-2xl z-40 select-none" style="top:74px; right:12px;">
      <div class="flex items-center gap-2 px-3 py-2 border-b border-[#1f1f1f] cursor-pointer" onclick="toggleTaskPanel()" title="点击展开/收起">
        <div class="w-1.5 h-1.5 rounded-full flex-shrink-0" id="taskPanelDot" style="background:#333;"></div>

        <span class="ml-auto text-[10px] font-mono text-[#888]" id="taskPanelCount">0</span>
        <span class="text-[10px] text-[#555]" id="taskPanelArrow">▸</span>
      </div>
      <div id="taskPanelBody">
        <div id="taskEmpty" class="px-3 py-3 text-[11px] text-[#555] text-center">暂无等待任务</div>

        <div class="px-3 py-1.5 text-[9px] text-[#444] border-t border-[#1a1a1a] flex items-center justify-between">

          <button onclick="clearDoneTasks()" class="text-[#555] hover:text-[#ff6b6b] transition-colors bg-transparent border-0 cursor-pointer" title="清空已完成任务">清空已完成</button>
        </div>
      </div>

  <!-- 右侧：拓扑图 -->

    <!-- Agent 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666]" id="agentDot"></div>
        <span class="text-xs font-medium text-[#ccc]">上游 Agent</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono" id="agentProto">MCP/SSE</span>

      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#888]">状态</span><span class="flex items-center gap-1.5"><span class="text-[9px] text-[#fbbf24] bg-[#1a1a1a] px-1.5 py-0.5 rounded hidden" id="agentUnread">未读消息 0</span><span class="text-[#ddd]" id="agent状态">待接入</span></span></div>
        <div class="flex justify-between"><span class="text-[#888]">配对码</span><span class="font-mono text-[#ededed] font-semibold tracking-wider bg-[#1a1a1a] px-1.5 py-0.5 rounded" id="pairCode">------</span></div>
        <div class="flex justify-between"><span class="text-[#888]">设备</span><span class="text-[#ddd] truncate max-w-[120px]" id="agentDevice">-</span></div>
        <div class="flex justify-between"><span class="text-[#888]">平台</span><span class="text-[#ddd]" id="agentPlatform">-</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="copyPairCode()" title="复制配对码（发给智能体）">复制配对码</button>

      </div>
    </div>

    <!-- 连接线 Agent → Relay -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10" id="agentRelayLatency">-- ms</span>
    </div>

    <!-- Relay 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666]" id="relayDot"></div>
        <div class="w-1.5 h-1.5 rounded-full hidden" id="relayAgentDot" style="background: #3b82f6;"></div>
        <span class="text-xs font-medium text-[#ccc]">中转服务器</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono"><span id="relayProtoSSE">SSE</span> + <span id="relayProtoWSS">WSS</span></span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#888]">地址</span><span class="text-[#ddd] font-mono text-[11px] truncate max-w-[140px]" id="relayUrl">yunqiao.very.im</span></div>
        <div class="flex justify-between"><span class="text-[#888]">连接</span><span class="text-[#ddd]" id="relayStatus">未连接</span></div>
        <div class="flex justify-between"><span class="text-[#888]">平台</span><span class="text-[#ddd]" id="relayPlatform">-</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="toggleConnect()" id="connectBtn" title="连接或断开中继服务器">连接</button>
        <button class="text-xs py-1 px-2 rounded-lg bg-[#1a1a1a] text-[#777] hover:text-[#ededed] transition-all" onclick="configRelay()" title="配置中继服务器">配置</button>
      </div>
    </div>

    <!-- 连接线 Relay → Client -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10" id="relayClientLatency">-- ms</span>
    </div>

    <!-- Client 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666]" id="clientDot"></div>
        <span class="text-xs font-medium text-[#aaa]">客户端（本地电脑）</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono" id="clientProto">WSS</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#888]">工作目录</span><span class="text-[#ddd] font-mono text-[11px] truncate max-w-[130px]" id="workDir">未设置</span></div>
        <div class="flex justify-between"><span class="text-[#888]">平台</span><span class="text-[#ddd]" id="client平台">-</span></div>
        <div class="flex justify-between"><span class="text-[#888]">主机名</span><span class="text-[#ddd] truncate max-w-[120px]" id="client主机名">-</span></div>
      </div>
      <div class="px-3 py-2 border-t border-[#1f1f1f]">
        <div class="text-[11px] font-medium text-[#777] mb-2">权限模式</div>
        <div class="flex gap-1.5">
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#222] border border-[#333]" id="permSuper" onclick="setPermission('super')" title="超级模式是授权智能体拥有所有权限">
            <div class="w-1.5 h-1.5 rounded-full bg-[#ededed]"></div>
            <div class="text-[11px] font-medium text-[#ededed]">超级模式</div>
          </div>
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#1a1a1a] border border-[#222]" id="permWorkspace" onclick="setPermission('workspace')" title="工作区模式是限制智能体仅在工作区活动">
            <div class="w-1.5 h-1.5 rounded-full bg-[#444]"></div>
            <div class="text-[11px] font-medium text-[#666]">工作区模式</div>
          </div>
        </div>
      </div>
      <div class="px-3 py-2 text-[10px] text-[#444] text-center border-t border-[#1a1a1a]">会话在左侧边栏管理</div>
    </div>
  </aside>
</div>

<script>






console.log("JS loaded OK");



const state = { connected: false, pairCode: '------', ws: null, sessions: [], currentSessionId: null, deviceId: null, deviceName: '', cwd: '', logs: {}, platform: '', hostname: '', workDir: '', relayKey: '', permission: 'workspace', pendingMessages: [], agentHostname: '', agentPlatform: '' };
// 链路健康状态：relay=off/connecting/on, agent=off/on
var health = { relay: 'off', agent: 'off', relayLatency: 0, agentLatency: 0 };
var isDesktopApp = typeof window.pywebview !== 'undefined';

var _lastLogText = '';
var _lastLogTime = 0;
var _lastLogType = '';
var autoScroll = true;
var logFilter = 'all';
var BADGES = {
  cmd:    ['CMD',  '#3b82f6', 'text-[#93c5fd]'],
  out:    ['OUT',  '#71717a', 'text-[#d4d4d4]'],
  err:    ['ERR',  '#ff6b6b', 'text-[#ff8a8a]'],
  info:   ['INF',  '#64748b', 'text-[#a1a1aa]'],
  done:   ['OK',   '#4ade80', 'text-[#4ade80]'],
  file:   ['FILE', '#a78bfa', 'text-[#c4b5fd]'],
  code:   ['CODE', '#e0a458', 'text-[#e0a458]'],
  status: ['SYS',  '#5b6472', 'text-[#8a8a8a]'],
  action: ['AGT',  '#4ade80', 'text-[#4ade80]'],
  msg:    ['MSG',  '#fbbf24', 'text-[#fcd34d]'],
  warn:   ['WARN', '#fbbf24', 'text-[#fcd34d]'],
};
function logCat(type) {
  if (type === 'cmd' || type === 'out') return 'cmd';
  if (type === 'file' || type === 'code') return 'file';
  if (type === 'err' || type === 'warn') return 'err';
  if (type === 'msg') return 'msg';
  return 'sys';
}
function scrollLog() {
  if (!autoScroll) return;
  var log = document.getElementById('sessionLog');
  if (log) log.scrollTop = log.scrollHeight;
}
function toggleAutoScroll() {
  autoScroll = !autoScroll;
  var btn = document.getElementById('autoScrollBtn');
  if (btn) { btn.textContent = autoScroll ? '⤓ 滚动' : '⏸ 暂停'; btn.style.color = autoScroll ? '#555' : '#fbbf24'; }
  if (autoScroll) scrollLog();
}
function clearLog() {
  var log = document.getElementById('sessionLog');
  log.innerHTML = '';
  addLog('status', '日志已清空');
}
function setLogFilter(f) {
  logFilter = f;
  var btns = document.querySelectorAll('.lg-fbtn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].dataset.f === f);
  var log = document.getElementById('sessionLog');
  for (var j = 0; j < log.children.length; j++) {
    var t = log.children[j].dataset.t;
    log.children[j].style.display = (f === 'all' || t === f) ? '' : 'none';
  }
  scrollLog();
}
function addLog(type, text) {
  var _now = Date.now();
  // 只去重 3 秒内同类型同文本的重复推送（防事件刷屏）；不同文本/不同时间正常记录，
  // 否则用户连续发两条相同消息时第二条日志会被吞掉
  if (text === _lastLogText && type === _lastLogType && _now - _lastLogTime < 3000) return;
  _lastLogText = text;
  _lastLogTime = _now;
  _lastLogType = type;
  var log = document.getElementById('sessionLog');
  var entry = document.createElement('div');
  entry.className = 'entry flex items-start gap-2 py-[3px] animate-slide-up';
  entry.dataset.t = logCat(type);

  var now = new Date();
  var time = now.toTimeString().slice(0, 8);
  var b = BADGES[type] || BADGES.info;
  var multi = type === 'out' || type === 'err' || type === 'file' || type === 'code';
  var body = multi
    ? '<pre class="' + b[2] + '" style="margin:0;font-family:inherit;white-space:pre-wrap;word-break:break-all">' + esc(text) + '</pre>'
    : '<span class="' + b[2] + '">' + esc(text) + '</span>';
  entry.innerHTML = '<span class="lg-time pt-px">' + time + '</span><span class="lg-badge" style="color:' + b[1] + ';border-color:' + b[1] + '44;">' + b[0] + '</span><span class="flex-1 min-w-0">' + body + '</span>';
  if (logFilter !== 'all' && entry.dataset.t !== logFilter) entry.style.display = 'none';
  log.appendChild(entry);
  scrollLog();
}
function addCmdBlock(cmd, meta, p) {
  var log = document.getElementById('sessionLog');
  var block = document.createElement('div');
  block.className = 'entry cmd-block animate-slide-up';
  block.dataset.t = 'cmd';
  var now = new Date();
  var time = now.toTimeString().slice(0, 8);
  var ok = !p || p.exitCode === 0;
  var dur = null;
  if (meta && meta.duration != null) dur = meta.duration;
  else if (p && p.duration != null) dur = p.duration;
  var durText = dur != null ? Math.round(dur) + 'ms' : '';
  var exitText = (p && p.exitCode !== undefined) ? (ok ? '✓ ' : '✗ ') + p.exitCode : '';
  var title = document.createElement('div');
  title.className = 'flex items-center gap-2 px-1.5 py-1 rounded cursor-pointer hover:bg-[#161616] transition-colors';
  title.innerHTML =
    '<span class="lg-time">' + time + '</span>' +
    '<span class="lg-badge" style="color:#3b82f6;border-color:#3b82f644;">CMD</span>' +
    '<span class="text-[#93c5fd] font-medium flex-1 min-w-0 truncate">$ ' + esc(cmd) + '</span>' +
    (durText ? '<span class="text-[9px] text-[#666] font-mono flex-shrink-0">' + durText + '</span>' : '') +
    (exitText ? '<span class="text-[10px] font-mono flex-shrink-0 ' + (ok ? 'text-[#4ade80]' : 'text-[#ff6b6b]') + '">' + exitText + '</span>' : '') +
    '<span class="text-[#555] text-[9px] flex-shrink-0">▾</span>';
  var body = document.createElement('div');
  body.className = 'cmd-body pl-[62px] pb-1 space-y-0.5';
  var lines = [];
  if (meta && meta.cwd) lines.push('<div class="text-[10px] text-[#777]">📁 ' + esc(meta.cwd) + '</div>');
  if (p && p.stdout) lines.push('<pre class="text-[#d4d4d4]">' + esc(p.stdout) + '</pre>');
  if (p && p.stderr) lines.push('<pre class="text-[#ff8a8a]">' + esc(p.stderr) + '</pre>');
  if (p && p.killed) lines.push('<div class="text-[10px] text-[#fbbf24]">⏱ 超时被终止</div>');
  if (lines.length === 0) lines.push('<div class="text-[10px] text-[#555]">（无输出）</div>');
  body.innerHTML = lines.join('');
  title.addEventListener('click', function() {
    var hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    var arrow = title.lastElementChild;
    if (arrow) arrow.textContent = hidden ? '▾' : '▸';
  });
  block.appendChild(title);
  block.appendChild(body);
  if (logFilter !== 'all' && logFilter !== 'cmd') block.style.display = 'none';
  log.appendChild(block);
  scrollLog();
}
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function copyLog() {
  var log = document.getElementById('sessionLog');
  var text = '';
  for (var i = 0; i < log.children.length; i++) {
    text += log.children[i].textContent + '\n';
  }
  navigator.clipboard.writeText(text).then(function() {
    addLog('info', '日志已复制到剪贴板');
  }).catch(function() {
    // fallback
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    addLog('info', '日志已复制');
  });
}

var REPO_URL = 'https://github.com/ideasir/yunqiao';
var SKILL_RAW_URL = 'https://raw.githubusercontent.com/ideasir/yunqiao/main/skills/yunqiao-usage/SKILL.md';
function copyTextToClipboard(text, okLog) {
  navigator.clipboard.writeText(text).then(function() {
    addLog('done', okLog);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    addLog('done', okLog + '（fallback）');
  });
}

  copyTextToClipboard(REPO_URL, '仓库地址已复制: ' + REPO_URL);
}

function sendCommand() {
  var input = document.getElementById('cmdInput');
  var raw = input.value.trim();
  if (!raw) return;
  input.value = '';
  // 以 ! 开头 = 紧急消息（去掉前缀发送）
  var urgent = raw.charAt(0) === '!';
  var text = urgent ? raw.slice(1).trim() : raw;
  if (!text) return;
  if (window.pywebview && window.pywebview.api && window.pywebview.api.send_message) {
    // 桌面模式：消息进中继队列，Agent 读取后收到回执
    window.pywebview.api.send_message(text, urgent).then(function(r) {
      if (r && r.success && r.msgId) {
        state.pendingMessages.push({ id: r.msgId, text: text, urgent: urgent, done: false });
        updateAgentBadge();
        renderTaskPanel();
        addLog(urgent ? 'warn' : 'msg', (urgent ? '⚠️ [紧急] → Agent: ' : '→ Agent: ') + text);
      } else {
        addLog('err', '消息发送失败: ' + ((r && r.error) || '未知错误'));
      }
    }).catch(function() { addLog('err', '消息发送失败'); });
  } else if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    // 浏览器直连模式：直接发给中继（无回执跟踪）
    state.ws.send(JSON.stringify({ type: 'agent_message', requestId: 'msg_' + Date.now(), text: text, urgent: urgent }));
    addLog(urgent ? 'warn' : 'msg', (urgent ? '⚠️ [紧急] → Agent: ' : '→ Agent: ') + text);
  } else {
    addLog('err', '未连接服务器');
  }
}
function updateAgentBadge() {
  var el = document.getElementById('agentUnread');
  if (!el) return;
  var n = state.pendingMessages.filter(function(m) { return !m.done; }).length;
  if (n > 0) {
    el.textContent = '未读消息 ' + n;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

// ─── 任务队列面板 ────────────────────────────────
var panelOpen = false;      // 抽屉是否展开
var panelManual = false;    // 用户是否手动控制过（手动后不自动打扰）
var dragMsgIdx = -1;
function fmtTime(t) {
  var d = new Date(t);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function toggleTaskPanel() {
  panelManual = true;
  panelOpen = !panelOpen;
  applyPanelState();
}
function applyPanelState() {
  var panel = document.getElementById('taskPanel');
  var arrow = document.getElementById('taskPanelArrow');
  if (!panel) return;
  if (panelOpen) {
    panel.classList.add('expanded');
    if (arrow) arrow.textContent = '▾';
  } else {
    panel.classList.remove('expanded');
    if (arrow) arrow.textContent = '▸';
  }
}
function renderTaskPanel() {
  var list = document.getElementById('taskList');
  var empty = document.getElementById('taskEmpty');
  var count = document.getElementById('taskPanelCount');
  var dot = document.getElementById('taskPanelDot');
  var n = state.pendingMessages.filter(function(m) { return !m.done; }).length;
  count.textContent = n;
  if (dot) dot.style.background = n > 0 ? '#fbbf24' : '#333';
  empty.style.display = state.pendingMessages.length === 0 ? '' : 'none';
  list.style.display = state.pendingMessages.length === 0 ? 'none' : '';
  list.innerHTML = '';
  state.pendingMessages.forEach(function(m, idx) {
    var row = document.createElement('div');
    if (m.done) {
      // 已完成：划掉 + 灰色 + ✓，保留删除
      row.className = 'flex items-start gap-2 px-3 py-1.5 border-b border-[#1a1a1a] opacity-45 text-xs';
      row.innerHTML =
        '<span class="text-[9px] text-[#555] font-mono pt-0.5 flex-shrink-0">' + fmtTime(m.doneTime || m.time) + '</span>' +
        '<span class="flex-1 break-all leading-tight text-[#777] line-through">' + esc(m.text) + '</span>' +
        '<span class="text-[10px] text-[#4ade80] flex-shrink-0" title="已完成">✓</span>' +
        '<button class="op-del text-[10px] text-[#666] hover:text-[#ff6b6b] leading-none flex-shrink-0" title="删除">✕</button>';
      row.querySelector('.op-del').addEventListener('click', function(e) {
        e.stopPropagation();
        deleteTask(parseInt(row.dataset.idx, 10));
      });
    } else {
      row.className = 'flex items-start gap-2 px-3 py-1.5 border-b border-[#1a1a1a] hover:bg-[#181818] cursor-grab text-xs';
      row.draggable = true;
      row.innerHTML =
        '<span class="text-[9px] text-[#555] font-mono pt-0.5 flex-shrink-0">' + fmtTime(m.time) + '</span>' +
        '<span class="' + (m.urgent ? 'text-[#ff6b6b]' : 'text-[#ddd]') + ' flex-1 break-all leading-tight">' +
        (m.urgent ? '⚠️ ' : '') + esc(m.text) + '</span>' +
        '<span class="flex flex-col gap-1 flex-shrink-0 ml-0.5">' +
        '<button class="op-edit text-[10px] text-[#777] hover:text-[#ededed] leading-none" title="编辑">✎</button>' +
        '<button class="op-del text-[10px] text-[#777] hover:text-[#ff6b6b] leading-none" title="删除">✕</button>' +
        '</span>';
      row.querySelector('.op-edit').addEventListener('click', function(e) {
        e.stopPropagation();
        editTask(parseInt(row.dataset.idx, 10));
      });
      row.querySelector('.op-del').addEventListener('click', function(e) {
        e.stopPropagation();
        deleteTask(parseInt(row.dataset.idx, 10));
      });
      row.addEventListener('dragstart', function(e) {
        if (e.target && e.target.closest && e.target.closest('button')) { e.preventDefault(); return; }
        dragMsgIdx = parseInt(this.dataset.idx, 10);
        this.style.opacity = '0.4';
        if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', function() { this.style.opacity = ''; });
      row.addEventListener('dragover', function(e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      });
      row.addEventListener('drop', function(e) {
        e.preventDefault();
        reorderTask(dragMsgIdx, parseInt(this.dataset.idx, 10));
      });
    }
    row.dataset.idx = idx;
    list.appendChild(row);
  });
  // 抽屉自动行为：无待读任务收起，有则展开（用户手动控制过则不打扰）
  if (n === 0) panelOpen = false;
  else if (!panelManual) panelOpen = true;
  applyPanelState();
}
// 原生确认框：桌面端走 pywebview（tkinter 原生），浏览器端降级 confirm
function nativeConfirm(title, message) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.confirm_dialog) {
    return window.pywebview.api.confirm_dialog(title, message);
  }
  return Promise.resolve(window.confirm(message));
}
function deleteTask(idx) {
  var m = state.pendingMessages[idx];
  if (!m) return;
  nativeConfirm('删除任务', '删除这条任务？').then(function(ok) {
    if (!ok) return;
    state.pendingMessages.splice(idx, 1);
    renderTaskPanel();
    updateAgentBadge();
    syncDelete([m.id]);
    addLog('info', '任务已删除');
  });
}
function clearDoneTasks() {
  state.pendingMessages = state.pendingMessages.filter(function(m) { return !m.done; });
  renderTaskPanel();
  updateAgentBadge();
  addLog('info', '已完成任务已清空');
}
function syncDelete(ids) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.delete_messages) {
    window.pywebview.api.delete_messages(ids);
  }
}
function editTask(idx) {
  var m = state.pendingMessages[idx];
  var list = document.getElementById('taskList');
  if (!m || !list) return;
  var row = list.children[idx];
  if (!row) return;
  row.draggable = false;
  row.className = row.className.replace('cursor-grab', '');
  row.innerHTML = '<input type="text" class="flex-1 bg-transparent border border-[#333] rounded px-1.5 py-0.5 text-xs text-[#ededed] outline-none" value="' + esc(m.text) + '" />';
  var input = row.querySelector('input');
  input.focus();
  input.select();
  var done = false;
  function commit(save) {
    if (done) return;
    done = true;
    if (save && input.value.trim()) {
      var newText = input.value.trim();
      m.text = newText;
      syncEdit(m.id, newText);
      addLog('info', '任务已编辑');
    }
    renderTaskPanel();
  }
  input.addEventListener('keydown', function(e) {
    e.stopPropagation();
    if (e.key === 'Enter') commit(true);
    else if (e.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', function() { commit(true); });
}
function syncEdit(id, text) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.edit_message) {
    window.pywebview.api.edit_message(id, text);
  }
}
function reorderTask(from, to) {
  if (from === to || from < 0) return;
  var arr = state.pendingMessages;
  var item = arr.splice(from, 1)[0];
  arr.splice(to, 0, item);
  renderTaskPanel();
  syncTaskOrder();
  addLog('info', '任务已重排，Agent 将按新顺序读取');
}
function syncTaskOrder() {
  var ids = state.pendingMessages.map(function(m) { return m.id; });
  if (window.pywebview && window.pywebview.api && window.pywebview.api.reorder_messages) {
    window.pywebview.api.reorder_messages(ids);
  }
}

function getMcpBase() {
  var relayUrl = document.getElementById('relayUrl').textContent;
  var base = relayUrl;
  if (base.startsWith('wss://')) base = 'https://' + base.slice(6);
  else if (base.startsWith('ws://')) base = 'http://' + base.slice(5);
  else if (!base.startsWith('http')) base = 'https://' + base;
  return base.replace(/\/device$/, '').replace(/\/$/, '');
}
function fetchMcpTicket(forceRefresh) {
  // 缓存 MCP ticket，避免每次复制都作废旧地址
  if (!forceRefresh && state.mcpTicket && state.mcpUrl) {
    return Promise.resolve(state.mcpUrl);
  }
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_mcp_ticket) {
    return window.pywebview.api.get_mcp_ticket().then(function(r) {
      if (r && r.success && r.ticket) {
        state.mcpTicket = r.ticket;
        state.mcpUrl = getMcpBase() + '/mcp/' + r.ticket;
        return state.mcpUrl;
      }
      throw new Error((r && r.error) || '获取 MCP 地址失败');
    });
  }
  return Promise.reject(new Error('API 不可用'));
}
function refreshMcpTicket() {
  state.mcpTicket = '';
  state.mcpUrl = '';
  fetchMcpTicket(true).then(function(url) {
    addLog('info', 'MCP 地址已刷新（旧地址已作废）');
  }).catch(function(e) {
    addLog('err', '刷新 MCP 地址失败: ' + e.message);
  });
}
function copyPairCode() {
  // 复制动态 MCP 地址 + 配对码（缓存 ticket，不重复生成）
  fetchMcpTicket(false).then(function(url) {
    copyTextToClipboard('云桥地址: ' + url + '\n配对码: ' + state.pairCode, '已复制：动态 MCP 地址 + 配对码');
  }).catch(function(e) { addLog('err', '获取 MCP 地址失败: ' + e.message); });
}
function copyMcpUrl() {
  // 单独复制动态 MCP 地址
  fetchMcpTicket(false).then(function(url) {
    copyTextToClipboard(url, '动态 MCP 地址已复制');
  }).catch(function(e) { addLog('err', '获取 MCP 地址失败: ' + e.message); });
}
function refreshPairCode() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.refresh_pair_code) {
    window.pywebview.api.refresh_pair_code().then(function(result) {
      state.pairCode = result.pairCode;
      var el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
      addLog('done', '配对码已推送至中转服务器');
      addLog('info', '请复制并发送给智能体：云桥地址 ' + (document.getElementById('relayUrl')?.textContent || '') + ' 配对码 ' + state.pairCode);
    });
  } else {
    state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
    var el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
    addLog('done', '配对码已推送至中转服务器');
    addLog('info', '请复制并发送给智能体：云桥地址 ' + (document.getElementById('relayUrl')?.textContent || '') + ' 配对码 ' + state.pairCode);
  }
}

function openSessionModal() {
  document.getElementById('modalSessionName').value = '工作区 ' + (state.sessions.length + 1);
  document.getElementById('modalSessionDir').value = state.workDir || state.homeDir || 'C:\\Users\\Administrator';
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  setTimeout(function() {
    content.style.transform = 'scale(1) translateY(0)';
    content.style.opacity = '1';
  }, 10);
  setTimeout(function() {
    document.getElementById('modalSessionName').focus();
    document.getElementById('modalSessionName').select();
  }, 100);
}
function closeSessionModal() {
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function createSession() {
  openSessionModal();
}


function saveSessionModal() {
  var name = document.getElementById('modalSessionName').value.trim() || '工作区';
  var dir = document.getElementById('modalSessionDir').value.trim() || state.homeDir || 'C:\\Users\\Administrator';
  // 桌面端：调后端 API 创建会话（影响 Agent 实际工作目录）
  if (window.pywebview && window.pywebview.api && window.pywebview.api.create_session) {
    window.pywebview.api.create_session(dir, name).then(function(r) {
      if (r && r.success) {
        loadSessions();
        addLog('done', '工作区已创建: ' + name);
      } else {
        addLog('err', '创建工作区失败: ' + ((r && r.error) || ''));
      }
    }).catch(function(e) { addLog('err', '创建工作区失败: ' + ((e && e.message) || e || '未知错误')); });
  } else {
    // 浏览器直连：纯前端模式
    var id = 's_' + Date.now().toString(36);
    state.sessions.push({ id: id, name: name, workDir: dir, cwd: dir, isDefault: state.sessions.length === 0 });
    state.workDir = dir;
    if (!state.currentSessionId) state.currentSessionId = id;
    renderSidebar(); updateStatus();
    addLog('info', '会话已创建: ' + name + ' (浏览器模式)');
  }
  // 关闭弹窗
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function browseSessionDir(e) {
  var input = document.getElementById('modalSessionDir');
  var btn = e ? e.target : null;
  if (btn) { btn.textContent = '...'; btn.style.opacity = '0.5'; }
  // 桌面端：用原生"选择文件夹"对话框（tkinter），返回完整路径
  if (window.pywebview && window.pywebview.api && window.pywebview.api.browse_folder) {
    window.pywebview.api.browse_folder().then(function(path) {
      if (path) input.value = path;
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
    }).catch(function() {
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
      input.focus();
      input.select();
    });
    return;
  }
  // 浏览器直连模式：showDirectoryPicker（只能拿到目录名）或手动输入
  if (window.showDirectoryPicker) {
    window.showDirectoryPicker().then(function(handle) {
      document.getElementById('modalSessionDir').value = handle.name;
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
    }).catch(function() {
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
      input.focus();
      input.select();
    });
    return;
  }
  // 降级：手动输入
  if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
  input.focus();
  input.select();
}
function refreshSessions() { addLog('info', '会话列表已刷新'); }
var ctxSessionId = null;
function renderSidebar() {
  var list = document.getElementById('sidebarList');
  if (!list) return;
  list.innerHTML = '';
  // 默认会话置顶
  var sorted = [].concat(state.sessions);
  sorted.sort(function(a, b) {
    if (a.id === state.currentSessionId) return -1;
    if (b.id === state.currentSessionId) return 1;
    return 0;
  });
  sorted.forEach(function(s) {
    var isDefault = s.id === state.currentSessionId;
    var item = document.createElement('div');
    item.className = 'flex items-center justify-center rounded-lg cursor-pointer text-xs font-semibold transition-all relative';
    if (isDefault) {
      item.style.cssText = 'background:#222;color:#4ade80;width:26px;height:26px;border:1px solid #4ade80;';
    } else {
      item.style.cssText = 'color:#666;width:26px;height:26px;background:transparent;';
    }
    item.title = (s.name || 'unnamed') + ' - ' + (s.workDir || '');
    item.textContent = (s.name || '?').slice(0, 2);
    item.style.fontSize = '10px';
    item.onmouseover = function() { if (!isDefault) { this.style.background = '#1a1a1a'; this.style.color = '#aaa'; } };
    item.onmouseout = function() { if (!isDefault) { this.style.background = 'transparent'; this.style.color = '#666'; } };
    item.onclick = function(e) {
      e.stopPropagation();
      setDefaultSession(s.id);  // 左键单击 = 切换为该工作区
    };
    item.oncontextmenu = function(e) {
      e.preventDefault();
      e.stopPropagation();
      ctxSessionId = s.id;
      var menu = document.getElementById('ctxMenu');
      menu.style.display = 'block';
      menu.style.left = '48px';
      menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + 'px';
    };
    list.appendChild(item);
  });
}

});

function setDefaultSession(id) {
  var s = state.sessions.find(function(s) { return s.id === id; });
  if (window.pywebview && window.pywebview.api && window.pywebview.api.switch_session) {
    window.pywebview.api.switch_session(id).then(function(r) {
      if (r && r.success) {
        loadSessions();
        addLog('done', '工作区已切换: ' + (s ? s.name : id));
      } else {
        addLog('err', '切换工作区失败: ' + ((r && r.error) || ''));
      }
    }).catch(function(e) { addLog('err', '切换工作区失败: ' + ((e && e.message) || e || '未知错误')); });
  } else {
    state.currentSessionId = id;
    renderSidebar();
    updateStatus();
    addLog('status', '默认工作区已切换: ' + (s ? s.name : id));
  }
}
function closeSession(id) {
  nativeConfirm('关闭会话', '确定关闭此会话?').then(function(ok) {
    if (!ok) return;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.close_session) {
      // 桌面端：同步删除后端会话（否则刷新后会复活）
      window.pywebview.api.close_session(id).then(function(r) {
        if (r && r.success) {
          loadSessions();
          addLog('done', '会话已关闭: ' + id);
        } else {
          addLog('err', '关闭会话失败: ' + ((r && r.error) || ''));
        }
      }).catch(function(e) { addLog('err', '关闭会话失败: ' + ((e && e.message) || e || '未知错误')); });
    } else {
      state.sessions = state.sessions.filter(function(s) { return s.id !== id; });
      if (state.currentSessionId === id) { state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null; }
      renderSidebar(); addLog('info', '会话已关闭: ' + id);
    }
  });
}

function handleBridge(action, data) {
  if (action === 'log') {
    var t = 'info';
    var txt = data.text || '';
    if (txt.indexOf('[通知]') !== -1) t = 'info';
    else if (txt.indexOf('[执行]') !== -1 || txt.indexOf('[目录]') !== -1) t = 'out';
    else if (txt.indexOf('[读取]') !== -1 || txt.indexOf('[新建]') !== -1 || txt.indexOf('[修改]') !== -1 || txt.indexOf('[写入]') !== -1) t = 'file';
    else if (txt.indexOf('✅') !== -1) t = 'done';
    else if (txt.indexOf('❌') !== -1 || txt.indexOf('失败') !== -1) t = 'err';
    else if (txt.indexOf('⚠️') !== -1) t = 'warn';
    else if (txt.charAt(0) === '[') t = 'action';
    addLog(t, txt);
  }
  else if (action === 'messages_read') {
    var ids = data.ids || [];
    var marked = 0;
    state.pendingMessages.forEach(function(m) {
      if (ids.indexOf(m.id) !== -1 && !m.done) {
        m.done = true;
        m.doneTime = Date.now();
        marked++;
      }
    });
    if (marked > 0) {
      updateAgentBadge();
      renderTaskPanel();
      addLog('done', '✅ Agent 已处理 ' + marked + ' 条消息（任务已划掉）');
    }
  }
  else if (action === 'agent_activity') {
    renderActivityDots(data);
  }
  else if (action === 'sync_status') {
    state.pairCode = data.pairCode || state.pairCode;
    state.workDir = data.workDir || state.workDir;
    state.sessions = data.sessions || state.sessions;
    state.currentSessionId = data.currentSessionId || state.currentSessionId;
    updateStatus();
    renderSidebar();
  }
  else if (action === 'command_result') {
    var p = data.payload;
    if (p && p.exitCode !== undefined) {
      addCmdBlock(p.command || '(命令)', p, p);
    }
  }
  else if (action === 'agent_status') {
    var s = document.getElementById('agent状态');
    if (data.status === 'connected') {
      s.textContent = '已配对'; s.style.color = '#4ade80';
      // 更新 Agent 设备信息
      var ad = document.getElementById('agentDevice');
      if (ad && data.agentHostname) { ad.textContent = data.agentHostname; }
      var ap = document.getElementById('agentPlatform');
      if (ap && data.agentPlatform) { ap.textContent = data.agentPlatform; }
      // 连接线延迟
      var arl = document.getElementById('agentRelayLatency');
      if (arl && data.latency) { arl.textContent = data.latency + ' ms'; arl.style.color = '#3b82f6'; }
      var rp = document.getElementById('relayPlatform');
      if (rp && data.relayPlatform) { rp.textContent = data.relayPlatform; }
      var agentDot = document.getElementById('agentDot');
      if (agentDot) agentDot.className = 'w-1.5 h-1.5 rounded-full bg-[#3b82f6] animate-pulse';
      var relayAgentDot = document.getElementById('relayAgentDot');
      if (relayAgentDot) {
        relayAgentDot.classList.remove('hidden');
        relayAgentDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse';
        relayAgentDot.style.background = '#3b82f6';
      }
      // 点亮 Agent 协议标签
      var ap = document.getElementById('agentProto');
      if (ap) { ap.style.color = '#3b82f6'; ap.style.textShadow = '0 0 8px rgba(59,130,246,0.3)'; }
      var rs = document.getElementById('relayProtoSSE');
      if (rs) { rs.style.color = '#3b82f6'; rs.style.textShadow = '0 0 8px rgba(59,130,246,0.3)'; }
      health.agent = 'on';
      health.agentLatency = data.latency || 0;
      state.agentHostname = data.agentHostname || '';
      state.agentPlatform = data.agentPlatform || '';
      updateHealth();
    } else {
      s.textContent = '待接入'; s.style.color = '#bbb';
      var agentDot = document.getElementById('agentDot');
      if (agentDot) agentDot.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      var relayAgentDot = document.getElementById('relayAgentDot');
      if (relayAgentDot) {
        relayAgentDot.classList.add('hidden');
        relayAgentDot.className = 'w-1.5 h-1.5 rounded-full hidden';
      }
      // 熄灭 Agent 协议标签
      var ap = document.getElementById('agentProto');
      if (ap) { ap.style.color = '#555'; ap.style.textShadow = ''; }
      var rs2 = document.getElementById('relayProtoSSE');
      if (rs2) { rs2.style.color = '#555'; rs2.style.textShadow = ''; }
      health.agent = 'off';
      health.agentLatency = 0;
      updateHealth();
    }
  }
  else if (action === 'relay_status') {
    var dot = document.getElementById('relayDot');
    var btn = document.getElementById('connectBtn');
    var status = document.getElementById('relayStatus');
    if (data.status === 'connected') {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-[#4ade80] animate-pulse';
      status.textContent = '已连接';
      status.style.color = '#4ade80';
      // 显示延迟
      var rl = document.getElementById('relayLatency');
      if (rl && data.latency) { rl.textContent = data.latency + ' ms'; rl.style.color = '#4ade80'; }
      var rcl = document.getElementById('relayClientLatency');
      if (rcl && data.latency) { rcl.textContent = data.latency + ' ms'; rcl.style.color = '#4ade80'; }
      btn.textContent = '断开';
      btn.style.background = '#7f1d1d';
      btn.style.color = '#fca5a5';
      var cd = document.getElementById('clientDot');
      if (cd) cd.className = 'w-1.5 h-1.5 rounded-full bg-[#4ade80] animate-pulse';
      addLog('done', '中转服务器已连接');
      addLog('info', '配对码已推送: ' + state.pairCode + '，请复制发送给 Agent');
      // 连接时清除缓存的 MCP ticket（配对码可能变了，下次复制重新生成）
      state.mcpTicket = '';
      state.mcpUrl = '';
      // 点亮 WSS 协议标签
      var rw = document.getElementById('relayProtoWSS');
      if (rw) { rw.style.color = '#4ade80'; rw.style.textShadow = '0 0 8px rgba(74,222,128,0.3)'; }
      var cp = document.getElementById('clientProto');
      if (cp) { cp.style.color = '#4ade80'; cp.style.textShadow = '0 0 8px rgba(74,222,128,0.3)'; }
      health.relay = 'on';
      health.relayLatency = data.latency || 0;
      updateHealth();
    } else {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      status.textContent = '未连接';
      status.style.color = '#bbb';
      btn.textContent = '连接';
      btn.style.background = '#222';
      btn.style.color = '#ededed';
      var cd = document.getElementById('clientDot');
      if (cd) cd.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      var rad = document.getElementById('relayAgentDot');
      if (rad) { rad.classList.add('hidden'); }
      addLog('info', '中转服务器已断开');
      // 熄灭 WSS 协议标签
      var rw = document.getElementById('relayProtoWSS');
      if (rw) { rw.style.color = '#555'; rw.style.textShadow = ''; }
      var cp = document.getElementById('clientProto');
      if (cp) { cp.style.color = '#555'; cp.style.textShadow = ''; }
      health.relay = 'off';
      health.relayLatency = 0;
      health.agent = 'off';
      health.agentLatency = 0;
      updateHealth();
    }
  }
}
function updateHealth() {
  var dot = document.getElementById('conn状态');
  if (!dot) return;
  var color = '#444', label = '未连接', pulse = '';
  if (health.relay === 'connecting') { color = '#fbbf24'; label = '连接中'; pulse = ' animate-pulse'; }
  else if (health.relay === 'on' && health.agent === 'on') { color = '#4ade80'; label = '链路正常'; }
  else if (health.relay === 'on') { color = '#fbbf24'; label = '中继已连，Agent 未接入'; }
  dot.style.background = color;
  dot.className = 'w-3 h-3 rounded-full cursor-pointer transition-colors' + pulse;
  dot.title = '链路状态：' + label + '（点击复制诊断信息）';
}
function windowMinimize() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.window_minimize) window.pywebview.api.window_minimize();
}
function windowClose() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.window_close) window.pywebview.api.window_close();
}
// 标题栏拖拽由 pywebview 原生处理（.pywebview-drag-region class + easy_drag=False），
// 仅限标题栏可拖，日志区等正文区域不受影响，可正常拖动选字。
// 不再手动调 start_drag()——它会与原生 onBodyMouseDown 冲突，且曾导致全局鼠标被接管。
function copyDiagInfo() {
  var relayAddr = document.getElementById('relayUrl') ? document.getElementById('relayUrl').textContent : '-';
  var relayState = health.relay === 'on' ? '已连接' : (health.relay === 'connecting' ? '连接中' : '未连接');
  var agentState = health.agent === 'on' ? '已配对' : '待接入';
  var lines = [
    '云桥链路诊断 ' + new Date().toLocaleString(),
    '客户端: ' + (state.hostname || '-') + ' / ' + (state.platform || '-') + ' 配对码:' + (state.pairCode || '-'),
    '工作目录: ' + (state.workDir || '-'),
    '中继: ' + relayState + (health.relayLatency ? ' ' + health.relayLatency + 'ms' : '') + ' ' + relayAddr,
    'Agent: ' + agentState + (health.agentLatency ? ' ' + health.agentLatency + 'ms' : '') + ' ' + (state.agentHostname || '-') + ' / ' + (state.agentPlatform || '-'),
  ];
  copyTextToClipboard(lines.join('\n'), '链路诊断信息已复制');
}
// 标题栏活跃灯排：灯总数 = 该用户连接配额，亮 = Agent 当前活跃连接
// 忙（有工具调用/任务运行）时快闪，空闲时慢呼吸；多灯错开延迟形成流动感
function renderActivityDots(a) {
  var el = document.getElementById('activityDots');
  if (!el) return;
  var total = (a && a.maxConnections) || 10;
  var used = (a && a.connections) || 0;
  var busy = (((a && a.pendingCalls) || 0) + ((a && a.runningTasks) || 0)) > 0;
  var html = '';
  // 从中间往两边扩散：计算每盏灯到中心的距离，延迟 = 距离 * 70ms
  var center = (total - 1) / 2;
  for (var i = 0; i < total; i++) {
    var dist = Math.abs(i - center);
    var delay = Math.round(dist * 80) + 'ms';
    if (i < used) {
      var cls = busy ? 'blink-fast' : 'animate-pulse';
      html += '<span class="w-1.5 h-1.5 rounded-full inline-block bg-[#4ade80] ' + cls + '" style="animation-delay:' + delay + '"></span>';
    } else {
      html += '<span class="w-1.5 h-1.5 rounded-full inline-block bg-[#2a2a2a]" title="空闲"></span>';
    }
  }
  el.innerHTML = html;
  el.title = 'Agent 活跃: ' + used + '/' + total + (a && a.runningTasks ? ' · 任务 ' + a.runningTasks : '') + (a && a.pendingCalls ? ' · 调用 ' + a.pendingCalls : '');
}

// 从后端获取状态（pywebview API 可能延迟注入）
// 注意：必须在全局作用域声明（saveSessionModal/setDefaultSession/closeSession 都会调用 loadSessions）
function loadStatus() {
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.get_status().then(function(s) {
      state.pairCode = s.pairCode || state.pairCode;
      state.deviceName = s.deviceName || '';
      state.platform = s.platform || '';
      state.hostname = s.hostname || '';
      state.homeDir = s.homeDir || '';
      updateStatus();
    });
  } else {
    setTimeout(loadStatus, 500);
  }
}
// 从后端加载会话和工作区（pywebview API 可能延迟注入）
function loadSessions() {
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.get_sessions().then(function(data) {
      if (data && data.sessions) {
        state.sessions = data.sessions;
        state.currentSessionId = data.currentId || '';
        state.workDir = data.workDir || '';
        updateStatus();
        renderSidebar();
      }
    });
  } else {
    setTimeout(loadSessions, 500);
  }
}

function toggleConnect() {
  health.relay = 'connecting';
  updateHealth();
  if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_connect) {
    window.pywebview.api.toggle_connect();
  } else {
    // 浏览器直连模式：无后端可连
    addLog('err', '浏览器直连模式暂不支持连接中转服务器，请使用桌面客户端');
    health.relay = 'off';
    updateHealth();
  }
}
function configRelay() {
  document.getElementById('modalRelayUrl').value = document.getElementById('relayUrl').textContent;
  // 尝试从后端读取当前配置
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.get_settings().then(function(cfg) {
      if (cfg && cfg.key) state.relayKey = cfg.key;
      if (cfg && cfg.relayUrl) document.getElementById('modalRelayUrl').value = cfg.relayUrl;
      if (cfg && typeof cfg.autoConnect !== 'undefined') {
        state.autoConnect = cfg.autoConnect;
        document.getElementById('modalAutoConnect').checked = cfg.autoConnect;
      }
    }).catch(function() {});
  }
  document.getElementById('modalRelayKey').value = state.relayKey || '';
  document.getElementById('modalAutoConnect').checked = state.autoConnect || false;
  var overlay = document.getElementById('configModal');
  var content = document.getElementById('configModalContent');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  setTimeout(function() {
    content.style.transform = 'scale(1) translateY(0)';
    content.style.opacity = '1';
  }, 10);
  setTimeout(function() {
    document.getElementById('modalRelayUrl').focus();
    document.getElementById('modalRelayUrl').select();
  }, 100);
}
function closeConfigModal() {
  var overlay = document.getElementById('configModal');
  var content = document.getElementById('configModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function saveConfigModal() {
  var url = document.getElementById('modalRelayUrl').value.trim();
  var key = document.getElementById('modalRelayKey').value.trim();
  // 自动补 wss:// 前缀
  if (url && !url.startsWith('ws://') && !url.startsWith('wss://')) {
    url = 'wss://' + url;
  }
  // 自动补 /device 路径
  if (url && !url.endsWith('/device')) {
    url = url + '/device';
  }
  if (url) document.getElementById('relayUrl').textContent = url;
  if (key) state.relayKey = key;
  state.autoConnect = document.getElementById('modalAutoConnect').checked;
  try {
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.save_settings(key, url, state.autoConnect);
    }
  } catch(e) {}
  addLog('info', '中转服务器配置已更新');
  closeConfigModal();
}

      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">Key（密钥）</label>
        <input type="text" id="modalRelayKey" class="w-full bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="输入密钥" />
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="modalAutoConnect" class="w-3 h-3 rounded" />
        <label for="modalAutoConnect" class="text-xs text-[#888]">启动时自动连接</label>
      </div>
    </div>
    <div class="flex gap-2 px-4 py-3 border-t border-[#222]">
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all font-medium" onclick="closeConfigModal()" title="取消中继服务器配置">取消</button>
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveConfigModal()" title="保存中继服务器配置">确定</button>
    </div>
  </div>
</div>

<!-- 新建会话弹窗 -->
<div id="sessionModal" class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-300" style="background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; backdrop-filter: blur(4px);">
  <div id="sessionModalContent" class="rounded-xl bg-[#1a1a1a] border border-[#333] shadow-2xl w-80 transition-all duration-300" style="transform: scale(0.9) translateY(20px); opacity: 0;">
    <div class="px-4 py-3 border-b border-[#222]">
      <span class="text-sm font-medium text-[#ededed]">新建工作区</span>
    </div>
    <div class="px-4 py-3 space-y-3">
      <div>
        <label class="text-xs text-[#888] block mb-1">工作区名称</label>
        <input type="text" id="modalSessionName" class="w-full bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="输入名称" />
      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">工作目录</label>
        <div class="flex gap-2">
          <input type="text" id="modalSessionDir" class="flex-1 bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="C:\Users\Administrator" />
          <button class="text-xs px-3 py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all" onclick="browseSessionDir(event)" title="选择工作目录">浏览</button>
        </div>
      </div>
    </div>
    <div class="flex gap-2 px-4 py-3 border-t border-[#222]">
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all font-medium" onclick="closeSessionModal()" title="取消新建工作区">取消</button>
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveSessionModal()" title="保存工作区">确定</button>
    </div>
  </div>
</div>
</body>
</html>
