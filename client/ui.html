  <!-- 左侧侧边栏 -->
  <div class="flex flex-col items-center gap-1.5 py-2.5 px-1.5 flex-shrink-0 select-none bg-[#0d0d0d] ">
    <div class="w-7 h-7 flex items-center justify-center rounded-lg cursor-pointer text-base font-semibold text-[#888] transition-all hover:bg-[#1a1a1a] hover:text-[#ededed]" onclick="createSession()" title="新建会话">+</div>

  <div class="flex-1 flex flex-col min-w-0 bg-[#0a0a0a]">

    <!-- 路径栏 -->
    <div class="flex items-center gap-2 px-5 py-2 flex-shrink-0 select-none bg-[#0a0a0a] ">
      <span class="text-[#666] text-sm font-bold">❯</span>

      <button onclick="copyLog()" class="text-[10px] text-[#555] hover:text-[#aaa] transition-colors cursor-pointer bg-transparent border-0" title="复制日志">📋</button>
    </div>

    <!-- 日志区 -->
    <div class="flex-1 overflow-y-auto px-5 py-3 font-mono text-xs leading-relaxed select-text" id="sessionLog" style="user-select: text; -webkit-user-select: text;">
      <div class="entry info flex gap-3 py-1 animate-slide-up"><span class="text-[#777] flex-shrink-0 min-w-[60px]">--:--:--</span><span class="text-[#ccc]">云桥 MCP v2.0 运行中</span></div>
      <div class="entry info flex gap-3 py-1 animate-slide-up"><span class="text-[#777] flex-shrink-0 min-w-[60px]">--:--:--</span><span class="text-[#bbb]">输入命令开始操作</span></div>
    </div>

  <!-- 右侧：拓扑图 -->
  <aside class="w-64 flex flex-col gap-0 p-0 overflow-y-auto flex-shrink-0 select-none bg-[#0d0d0d] " style="padding: 12px;">

    <!-- Agent 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">

        <span class="ml-auto text-[10px] text-[#555] font-mono">SSE</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">状态</span><span class="text-[#bbb]" id="agent状态">待接入</span></div>
        <div class="flex justify-between"><span class="text-[#666]">配对码</span><span class="font-mono text-[#ededed] font-semibold tracking-wider bg-[#1a1a1a] px-1.5 py-0.5 rounded" id="pairCode">------</span></div>
        <div class="flex justify-between"><span class="text-[#666]">设备</span><span class="text-[#bbb] truncate max-w-[120px]" id="deviceName">-</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="copyPairCode()" title="复制地址和配对码">复制</button>
        <button class="text-xs py-1 px-2 rounded-lg bg-[#1a1a1a] text-[#777] hover:text-[#ededed] transition-all" onclick="refreshPairCode()" title="刷新配对码">刷新</button>
      </div>
    </div>

    <!-- 连接线 Agent → Relay -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10">MCP/SSE</span>
    </div>

    <!-- Relay 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">

        <div class="w-1.5 h-1.5 rounded-full hidden" id="relayAgentDot" style="background: #3b82f6;"></div>
        <span class="text-xs font-medium text-[#aaa]">中转服务器</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono">WSS/HTTPS</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">地址</span><span class="text-[#bbb] font-mono text-[11px] truncate max-w-[140px]" id="relayUrl">yunqiao.very.im</span></div>
        <div class="flex justify-between"><span class="text-[#666]">延迟</span><span class="text-[#bbb] font-mono" id="relayLatency">-- ms</span></div>
        <div class="flex justify-between"><span class="text-[#666]">连接</span><span class="text-[#bbb]" id="relayStatus">未连接</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="toggleConnect()" id="connectBtn" title="连接或断开中继服务器">连接</button>
        <button class="text-xs py-1 px-2 rounded-lg bg-[#1a1a1a] text-[#777] hover:text-[#ededed] transition-all" onclick="configRelay()" title="配置中继服务器">配置</button>
      </div>
    </div>

    <!-- 连接线 Relay → Client -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10">WSS</span>
    </div>

    <!-- Client 节点 -->

      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">工作目录</span><span class="text-[#bbb] font-mono text-[11px] truncate max-w-[130px]" id="workDir">未设置</span></div>
        <div class="flex justify-between"><span class="text-[#666]">平台</span><span class="text-[#bbb]" id="client平台">-</span></div>
        <div class="flex justify-between"><span class="text-[#666]">主机名</span><span class="text-[#bbb] truncate max-w-[120px]" id="client主机名">-</span></div>
      </div>
      <div class="px-3 py-2 border-t border-[#1f1f1f]">
        <div class="text-[11px] font-medium text-[#777] mb-2">权限模式</div>
        <div class="flex gap-1.5">
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#222] border border-[#333]" id="permSuper" onclick="setPermission('super')" title="超级模式是授权智能体拥有所有权限">
            <div class="w-1.5 h-1.5 rounded-full bg-[#ededed]"></div>
            <div class="text-[11px] font-medium text-[#ededed]">超级模式</div>
          </div>
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#1a1a1a] border border-[#222]" id="permWorkspace" onclick="setPermission('workspace')" title="工作区模式是限制智能体仅在工作区活动">
            <div class="w-1.5 h-1.5 rounded-full bg-[#444]"></div>
            <div class="text-[11px] font-medium text-[#666]">工作区模式</div>
          </div>
        </div>
      </div>
      <div class="px-3 py-2 text-[10px] text-[#444] text-center border-t border-[#1a1a1a]">会话在左侧边栏管理</div>

<script>






console.log("JS loaded OK");



const state = { connected: false, pairCode: '------', ws: null, sessions: [], currentSessionId: null, deviceId: null, deviceName: '', cwd: '', logs: {}, platform: '', hostname: '', workDir: '', relayKey: 'yunqiao-mcp-key-2026', permission: 'super' };
var isDesktopApp = typeof window.pywebview !== 'undefined';

var _lastLogText = '';
var _lastLogTime = 0;
var _lastLogType = '';
function addLog(type, text) {
  var _now = Date.now();
  // 连续相同文本跳过
  if (text === _lastLogText) return;
  // 状态类日志快速重复跳过（3秒内同类型状态）
  if (type === 'status' || type === 'info' || type === 'done') {
    if (type === _lastLogType && _now - _lastLogTime < 3000) return;
  }
  _lastLogText = text;
  _lastLogTime = _now;
  _lastLogType = type;
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = 'entry ' + type + ' flex gap-3 py-1 animate-slide-up';

  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  const colors = {cmd:'text-white font-medium',out:'text-[#e8e8e8]',err:'text-[#ff6b6b]',info:'text-[#aaaaaa]',done:'text-white font-medium',file:'text-[#cccccc]',code:'text-[#cccccc]',status:'text-[#cccccc]'};
  const c = colors[type] || 'text-[#cccccc]';
  if (type === 'file' || type === 'code') {
    entry.innerHTML = '<span class="text-[#777] flex-shrink-0 min-w-[60px]">' + time + '</span><span class="' + c + '"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">' + esc(text) + '</pre></span>';
  } else {
    entry.innerHTML = '<span class="text-[#777] flex-shrink-0 min-w-[60px]">' + time + '</span><span class="' + c + '">' + esc(text) + '</span>';
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function copyLog() {
  var log = document.getElementById('sessionLog');
  var text = '';
  for (var i = 0; i < log.children.length; i++) {
    text += log.children[i].textContent + '\n';
  }
  navigator.clipboard.writeText(text).then(function() {
    addLog('info', '日志已复制到剪贴板');
  }).catch(function() {
    // fallback
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    addLog('info', '日志已复制');
  });
}

function sendCommand() {
  var input = document.getElementById('cmdInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  addLog('cmd', '$ ' + text);
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'execute_command', requestId: 'cmd_' + Date.now(), payload: { command: text, timeout: 30000 } }));
    state.ws.send(JSON.stringify({ type: 'agent_message', requestId: 'msg_' + Date.now(), text: text }));
  } else if (window.pywebview && window.pywebview.api) {
    try { pywebview.api.api_send_command(text); } catch(e) { addLog('err', '未连接到服务器'); }
  } else {
    addLog('err', '未连接到服务器');
  }
}

function copyPairCode() {
  var relayUrl = document.getElementById('relayUrl').textContent;
  // 推导 MCP 地址
  var mcpUrl = relayUrl;
  if (mcpUrl.startsWith('wss://')) mcpUrl = 'https://' + mcpUrl.slice(6);
  else if (mcpUrl.startsWith('ws://')) mcpUrl = 'http://' + mcpUrl.slice(5);
  else if (!mcpUrl.startsWith('http')) mcpUrl = 'https://' + mcpUrl;
  mcpUrl = mcpUrl.replace('/device', '/mcp');
  if (!mcpUrl.endsWith('/mcp')) mcpUrl = mcpUrl + '/mcp';
  navigator.clipboard.writeText('云桥地址: ' + mcpUrl + '\n配对码: ' + state.pairCode);
  addLog('info', '已复制：云桥地址 + 配对码');
}
function refreshPairCode() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.refresh_pair_code) {
    window.pywebview.api.refresh_pair_code().then(function(result) {
      state.pairCode = result.pairCode;
      var el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
      addLog('info', '配对码已刷新: ' + state.pairCode);
    });
  } else {
    state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
    var el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
    addLog('info', '配对码已刷新: ' + state.pairCode);
  }
}

function openSessionModal() {
  document.getElementById('modalSessionName').value = '工作区 ' + (state.sessions.length + 1);
  document.getElementById('modalSessionDir').value = state.workDir || 'C:\\Users\\Administrator';
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  setTimeout(function() {
    content.style.transform = 'scale(1) translateY(0)';
    content.style.opacity = '1';
  }, 10);
  setTimeout(function() {
    document.getElementById('modalSessionName').focus();
    document.getElementById('modalSessionName').select();
  }, 100);
}
function closeSessionModal() {
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function createSession() {
  openSessionModal();
}


function saveSessionModal() {
  var name = document.getElementById('modalSessionName').value.trim() || '工作区';
  var dir = document.getElementById('modalSessionDir').value.trim() || 'C:\\Users\\Administrator';
  var id = 's_' + Date.now().toString(36);
  state.sessions.push({ id: id, name: name, workDir: dir, cwd: dir, isDefault: state.sessions.length === 0 });
  state.workDir = dir;
  // 如果没有默认会话，则设为默认
  if (!state.currentSessionId) {
    state.currentSessionId = id;
  }
  renderSidebar(); renderSessions(); updateStatus();
  addLog('info', '会话已创建: ' + name + ' (' + id + ')');
  var overlay = document.getElementById('sessionModal');
  var content = document.getElementById('sessionModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function browseSessionDir(e) {
  var input = document.getElementById('modalSessionDir');
  var btn = e ? e.target : null;
  if (btn) { btn.textContent = '...'; btn.style.opacity = '0.5'; }
  
  // 尝试原生文件夹选择器
  if (window.showDirectoryPicker) {
    window.showDirectoryPicker().then(function(handle) {
      document.getElementById('modalSessionDir').value = handle.name;
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
    }).catch(function() {
      if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
      input.focus();
      input.select();
    });
    return;
  }
  // 降级：手动输入
  if (btn) { btn.textContent = '浏览'; btn.style.opacity = '1'; }
  input.focus();
  input.select();
}
function refreshSessions() { addLog('info', '会话列表已刷新'); }
var ctxSessionId = null;
function renderSidebar() {
  var list = document.getElementById('sidebarList');
  if (!list) return;
  list.innerHTML = '';
  // 默认会话置顶
  var sorted = [].concat(state.sessions);
  sorted.sort(function(a, b) {
    if (a.id === state.currentSessionId) return -1;
    if (b.id === state.currentSessionId) return 1;
    return 0;
  });
  sorted.forEach(function(s) {
    var isDefault = s.id === state.currentSessionId;
    var item = document.createElement('div');
    item.className = 'flex items-center justify-center rounded-lg cursor-pointer text-xs font-semibold transition-all relative';
    if (isDefault) {
      item.style.cssText = 'background:#222;color:#4ade80;width:26px;height:26px;border:1px solid #4ade80;';
    } else {
      item.style.cssText = 'color:#666;width:26px;height:26px;background:transparent;';
    }
    item.title = (s.name || 'unnamed') + ' - ' + (s.workDir || '');
    item.textContent = (s.name || '?').slice(0, 1);
    item.onmouseover = function() { if (!isDefault) { this.style.background = '#1a1a1a'; this.style.color = '#aaa'; } };
    item.onmouseout = function() { if (!isDefault) { this.style.background = 'transparent'; this.style.color = '#666'; } };
    item.onclick = function(e) {
      e.stopPropagation();
      ctxSessionId = s.id;
      var menu = document.getElementById('ctxMenu');
      menu.style.display = 'block';
      menu.style.left = '48px';
      menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + 'px';
    };
    list.appendChild(item);
  });
}
// 点击其他地方关闭菜单
document.addEventListener('click', function() {
  var menu = document.getElementById('ctxMenu');
  if (menu) menu.style.display = 'none';
});
function ctxSetDefault() {
  var menu = document.getElementById('ctxMenu');
  menu.style.display = 'none';
  if (ctxSessionId) setDefaultSession(ctxSessionId);
}
function ctxDelete() {
  var menu = document.getElementById('ctxMenu');
  menu.style.display = 'none';
  if (ctxSessionId) closeSession(ctxSessionId);
}

function renderSessions() {}

function switchSession(id) {
  // 查看会话日志（不切换默认工作区）
  var s = state.sessions.find(function(s) { return s.id === id; });
  if (s) {
    addLog('info', '查看会话: ' + (s.name || 'unnamed') + ' (' + id + ')');
  }
}

function setDefaultSession(id) {
  state.currentSessionId = id;
  renderSidebar();
  renderSessions();
  updateStatus();
  var s = state.sessions.find(function(s) { return s.id === id; });
  addLog('status', '默认工作区已切换: ' + (s ? s.name : id));
}
function closeSession(id) {
  if (!confirm('确定关闭此会话?')) return;
  state.sessions = state.sessions.filter(function(s) { return s.id !== id; });
  if (state.currentSessionId === id) { state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null; }
  renderSidebar(); renderSessions(); addLog('info', '会话已关闭: ' + id);
}

function setPermission(type) {
  state.permission = type;
  var superEl = document.getElementById('permSuper');
  var workspaceEl = document.getElementById('permWorkspace');
  if (type === 'super') {
    superEl.style.cssText = 'background: #222; border: 1px solid #333;';
    superEl.querySelector('div:first-child').className = 'w-1.5 h-1.5 rounded-full bg-[#ededed]';
    superEl.querySelector('div:last-child').className = 'text-[11px] font-medium text-[#ededed]';
    
    workspaceEl.style.cssText = 'background: #1a1a1a; border: 1px solid #222;';
    workspaceEl.querySelector('div:first-child').className = 'w-1.5 h-1.5 rounded-full bg-[#444]';
    workspaceEl.querySelector('div:last-child').className = 'text-[11px] font-medium text-[#666]';
    addLog('info', '权限模式: 超级');
  } else {
    workspaceEl.style.cssText = 'background: #222; border: 1px solid #333;';
    workspaceEl.querySelector('div:first-child').className = 'w-1.5 h-1.5 rounded-full bg-[#ededed]';
    workspaceEl.querySelector('div:last-child').className = 'text-[11px] font-medium text-[#ededed]';
    
    superEl.style.cssText = 'background: #1a1a1a; border: 1px solid #222;';
    superEl.querySelector('div:first-child').className = 'w-1.5 h-1.5 rounded-full bg-[#444]';
    superEl.querySelector('div:last-child').className = 'text-[11px] font-medium text-[#666]';
    addLog('info', '权限模式: 工作区');
  }
}

function updateStatus() {
  var el;
  el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
  el = document.getElementById('deviceName'); if (el) el.textContent = state.deviceName || '-';
  el = document.getElementById('client平台'); if (el) el.textContent = state.platform || '-';
  el = document.getElementById('client主机名'); if (el) el.textContent = state.hostname || '-';
  el = document.getElementById('workDir'); if (el) el.textContent = state.workDir || '未设置';
  el = document.getElementById('currentCwd'); if (el) el.textContent = state.workDir || '~';

}
function handleBridge(action, data) {
  if (action === 'log') { addLog('info', data.text); }
  else if (action === 'command_result') {
    var p = data.payload;
    if (p && p.exitCode !== undefined) {
      var txt = p.stdout || p.stderr || '(无输出)';
      addLog('out', txt);
      if (p.exitCode !== 0) addLog('err', '退出码: ' + p.exitCode);
      else addLog('done', '完成 (退出码: ' + p.exitCode + ')');
    }
  }
  else if (action === 'agent_status') {
    var s = document.getElementById('agent状态');
    if (data.status === 'connected') {
      s.textContent = '已配对'; s.style.color = '#4ade80';
      var agentDot = document.getElementById('agentDot');
      if (agentDot) agentDot.className = 'w-1.5 h-1.5 rounded-full bg-[#3b82f6] animate-pulse';
      var relayAgentDot = document.getElementById('relayAgentDot');
      if (relayAgentDot) {
        relayAgentDot.classList.remove('hidden');
        relayAgentDot.className = 'w-1.5 h-1.5 rounded-full animate-pulse';
        relayAgentDot.style.background = '#3b82f6';
      }
    } else {
      s.textContent = '待接入'; s.style.color = '#bbb';
      var agentDot = document.getElementById('agentDot');
      if (agentDot) agentDot.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      var relayAgentDot = document.getElementById('relayAgentDot');
      if (relayAgentDot) {
        relayAgentDot.classList.add('hidden');
        relayAgentDot.className = 'w-1.5 h-1.5 rounded-full hidden';
      }
    }
  }
  else if (action === 'relay_status') {
    var dot = document.getElementById('relayDot');
    var btn = document.getElementById('connectBtn');
    var status = document.getElementById('relayStatus');
    if (data.status === 'connected') {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-[#4ade80] animate-pulse';
      status.textContent = '已连接';
      status.style.color = '#4ade80';
      btn.textContent = '断开';
      btn.style.background = '#7f1d1d';
      btn.style.color = '#fca5a5';
      var cd = document.getElementById('clientDot');
      if (cd) cd.className = 'w-1.5 h-1.5 rounded-full bg-[#4ade80] animate-pulse';
      addLog('done', '中转服务器已连接');
    } else {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      status.textContent = '未连接';
      status.style.color = '#bbb';
      btn.textContent = '连接';
      btn.style.background = '#222';
      btn.style.color = '#ededed';
      var cd = document.getElementById('clientDot');
      if (cd) cd.className = 'w-1.5 h-1.5 rounded-full bg-[#666]';
      var rad = document.getElementById('relayAgentDot');
      if (rad) { rad.classList.add('hidden'); }
      addLog('info', '中转服务器已断开');
    }
  }
}
function setConn状态(status) {
  var dot = document.getElementById('conn状态');
  dot.className = 'w-2 h-2 rounded-full ' + (status === 'connected' ? 'bg-[#ededed]' : 'bg-[#444]');
}

(function() {
  refreshPairCode();
  updateStatus();
  addLog('info', '欢迎使用云桥 MCP v2.0');
  setConn状态('disconnected');
})();



function toggleConnect() {
  window.pywebview.api.toggle_connect();
}

function trafficFlash() {
  var relayDot = document.getElementById('relayDot');
  if (trafficTimer) clearTimeout(trafficTimer);
  relayDot.className = 'w-1.5 h-1.5 rounded-full bg-[#22d3ee]';
  trafficTimer = setTimeout(function() {
    relayDot.className = 'w-1.5 h-1.5 rounded-full bg-[#4ade80] animate-pulse';
  }, 500);
}
function configRelay() {
  document.getElementById('modalRelayUrl').value = document.getElementById('relayUrl').textContent;
  // 尝试从后端读取当前配置
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.get_settings().then(function(cfg) {
      if (cfg && cfg.key) state.relayKey = cfg.key;
      if (cfg && cfg.relayUrl) document.getElementById('modalRelayUrl').value = cfg.relayUrl;
    }).catch(function() {});
  }
  document.getElementById('modalRelayKey').value = state.relayKey || '';
  var overlay = document.getElementById('configModal');
  var content = document.getElementById('configModalContent');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  setTimeout(function() {
    content.style.transform = 'scale(1) translateY(0)';
    content.style.opacity = '1';
  }, 10);
  setTimeout(function() {
    document.getElementById('modalRelayUrl').focus();
    document.getElementById('modalRelayUrl').select();
  }, 100);
}
function closeConfigModal() {
  var overlay = document.getElementById('configModal');
  var content = document.getElementById('configModalContent');
  content.style.transform = 'scale(0.9) translateY(20px)';
  content.style.opacity = '0';
  setTimeout(function() {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
  }, 200);
}
function saveConfigModal() {
  var url = document.getElementById('modalRelayUrl').value.trim();
  var key = document.getElementById('modalRelayKey').value.trim();
  // 自动补 wss:// 前缀
  if (url && !url.startsWith('ws://') && !url.startsWith('wss://')) {
    url = 'wss://' + url;
  }
  // 自动补 /device 路径
  if (url && !url.endsWith('/device')) {
    url = url + '/device';
  }
  if (url) document.getElementById('relayUrl').textContent = url;
  if (key) state.relayKey = key;
  try {
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.save_settings(key, url);
    }
  } catch(e) {}
  addLog('info', '中转服务器配置已更新');
  closeConfigModal();
}










</script>

  <div id="configModalContent" class="rounded-xl bg-[#1a1a1a] border border-[#333] shadow-2xl w-80 transition-all duration-300" style="transform: scale(0.9) translateY(20px); opacity: 0;">
    <div class="px-4 py-3 border-b border-[#222]">
      <span class="text-sm font-medium text-[#ededed]">中转服务器配置</span>
    </div>
    <div class="px-4 py-3 space-y-3">
      <div>
        <label class="text-xs text-[#888] block mb-1">中转服务器地址</label>

      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">Key（密钥）</label>

      </div>
    </div>
    <div class="flex gap-2 px-4 py-3 border-t border-[#222]">
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all font-medium" onclick="closeConfigModal()" title="取消中继服务器配置">取消</button>
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveConfigModal()" title="保存中继服务器配置">确定</button>

  </div>
</div>

<div id="sessionModal" class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-300" style="background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; backdrop-filter: blur(4px);">

      <span class="text-sm font-medium text-[#ededed]">新建工作区</span>

        <label class="text-xs text-[#888] block mb-1">工作区名称</label>

      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">工作目录</label>

          <button class="text-xs px-3 py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all" onclick="browseSessionDir(event)" title="选择工作目录">浏览</button>

      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveSessionModal()" title="保存工作区">确定</button>
    </div>
  </div>
</div>
</body>
