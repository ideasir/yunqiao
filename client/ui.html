<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22 fill=%22%23888%22>~</text></svg>">
<title>云桥 MCP v2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        dark: { 950: '#0a0a0a', 900: '#111111', 800: '#171717', 700: '#222222', 600: '#2a2a2a', 500: '#333333' }
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">

</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#0a0a0a]">

<!-- ─── 标题栏 ─── -->
<header class="flex items-center gap-3 px-5 py-2.5 flex-shrink-0 select-none bg-[#0a0a0a] ">
  <div class="w-5 h-5 rounded flex items-center justify-center text-[10px] font-bold text-black bg-[#ededed] flex-shrink-0 ">~</div>
  <span class="text-sm font-medium text-[#ededed]">云桥 MCP</span>
  <span class="text-xs text-[#666] font-mono">v2.0</span>
  <div class="flex-1"></div>
  <div class="w-2 h-2 rounded-full bg-[#444]" id="conn状态"></div>

</header>

<!-- ─── 主体 ─── -->
<div class="flex flex-1 overflow-hidden gap-0">

  <!-- 左侧侧边栏 -->
  <div class="flex flex-col items-center gap-1.5 py-2.5 px-1.5 flex-shrink-0 select-none bg-[#0d0d0d] ">
    <div class="w-7 h-7 flex items-center justify-center rounded-lg cursor-pointer text-base font-semibold text-[#888] transition-all hover:bg-[#1a1a1a] hover:text-[#ededed]" onclick="createSession()" title="新建会话">+</div>
    <div class="w-4 h-px my-0.5 bg-[#222]"></div>
    <div class="flex flex-col gap-1 items-center flex-1 overflow-y-auto w-full px-0.5" id="sidebarList"></div>
      <!-- 上下文菜单 -->
    <div id="ctxMenu" class="fixed z-50 rounded-lg bg-[#1a1a1a] border border-[#333] shadow-xl py-1" style="display:none; min-width:140px;">
      <div class="px-3 py-1.5 text-xs text-[#aaa] hover:bg-[#222] hover:text-[#ededed] cursor-pointer transition-colors" onclick="ctxSetDefault()">设为默认工作区</div>
      <div class="px-3 py-1.5 text-xs text-[#aaa] hover:bg-[#222] hover:text-[#ff6b6b] cursor-pointer transition-colors border-t border-[#222]" onclick="ctxDelete()">删除工作区</div>
    </div>
  </div>

  <!-- 左侧：对话/日志 -->
  <div class="flex-1 flex flex-col min-w-0 bg-[#0a0a0a]">

    <!-- 路径栏 -->
    <div class="flex items-center gap-2 px-5 py-2 flex-shrink-0 select-none bg-[#0a0a0a] ">
      <span class="text-[#666] text-sm font-bold">❯</span>
      <span class="text-xs font-mono text-[#aaa] flex-1 truncate" id="currentCwd">~</span>
    </div>

    <!-- 日志区 -->
    <div class="flex-1 overflow-y-auto px-5 py-3 font-mono text-xs leading-relaxed" id="sessionLog">
      <div class="entry info flex gap-3 py-1 animate-slide-up"><span class="text-[#777] flex-shrink-0 min-w-[60px]">--:--:--</span><span class="text-[#ccc]">云桥 MCP v2.0 运行中</span></div>
      <div class="entry info flex gap-3 py-1 animate-slide-up"><span class="text-[#777] flex-shrink-0 min-w-[60px]">--:--:--</span><span class="text-[#bbb]">输入命令开始操作</span></div>
    </div>

    <!-- 输入区 -->
    <div class="flex items-stretch flex-shrink-0 bg-[#0a0a0a] border-t border-[#1a1a1a]">
      <span class="flex items-center pl-5 pr-1 text-[#888] text-sm font-bold select-none">❯</span>
      <input type="text" id="cmdInput" class="flex-1 bg-transparent border-none text-[#ededed] px-3 py-3 font-mono text-xs outline-none placeholder-[#666]" placeholder="输入命令..." spellcheck="false" onkeydown="if(event.key==='Enter')sendCommand()" />
    </div>
  </div>

  <!-- 右侧：拓扑图 -->
  <aside class="w-64 flex flex-col gap-0 p-0 overflow-y-auto flex-shrink-0 select-none bg-[#0d0d0d] " style="padding: 12px;">

    <!-- Agent 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666] animate-pulse"></div>
        <span class="text-xs font-medium text-[#aaa]">上游 Agent</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono">SSE</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">状态</span><span class="text-[#bbb]" id="agent状态">待接入</span></div>
        <div class="flex justify-between"><span class="text-[#666]">配对码</span><span class="font-mono text-[#ededed] font-semibold tracking-wider bg-[#1a1a1a] px-1.5 py-0.5 rounded" id="pairCode">------</span></div>
        <div class="flex justify-between"><span class="text-[#666]">设备</span><span class="text-[#bbb] truncate max-w-[120px]" id="deviceName">-</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="copyPairCode()">复制</button>
        <button class="text-xs py-1 px-2 rounded-lg bg-[#1a1a1a] text-[#777] hover:text-[#ededed] transition-all" onclick="refreshPairCode()">刷新</button>
      </div>
    </div>

    <!-- 连接线 Agent → Relay -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10">MCP/SSE</span>
    </div>

    <!-- Relay 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666]" id="relayDot"></div>
        <span class="text-xs font-medium text-[#aaa]">中转服务器</span>
        <span class="ml-auto text-[10px] text-[#555] font-mono">WSS/HTTPS</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">地址</span><span class="text-[#bbb] font-mono text-[11px] truncate max-w-[140px]" id="relayUrl">yunqiao.very.im</span></div>
        <div class="flex justify-between"><span class="text-[#666]">延迟</span><span class="text-[#bbb] font-mono" id="relayLatency">-- ms</span></div>
        <div class="flex justify-between"><span class="text-[#666]">连接</span><span class="text-[#bbb]" id="relayStatus">已连接</span></div>
      </div>
      <div class="flex gap-1.5 px-3 py-2 border-t border-[#1f1f1f]">
        <button class="flex-1 text-xs py-1 rounded-lg bg-[#222] text-[#ededed] hover:bg-[#2a2a2a] transition-all font-medium" onclick="connectRelay()">连接</button>
        <button class="text-xs py-1 px-2 rounded-lg bg-[#1a1a1a] text-[#777] hover:text-[#ededed] transition-all" onclick="configRelay()">配置</button>
      </div>
    </div>

    <!-- 连接线 Relay → Client -->
    <div class="relative flex items-center justify-center" style="height: 32px;">
      <div class="absolute w-px h-full bg-[#333]"></div>
      <span class="relative text-[10px] text-[#555] font-mono bg-[#0d0d0d] px-2 z-10">WSS</span>
    </div>

    <!-- Client 节点 -->
    <div class="rounded-xl bg-[#141414] border border-[#222222]">
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[#1f1f1f]">
        <div class="w-1.5 h-1.5 rounded-full bg-[#666]"></div>
        <span class="text-xs font-medium text-[#aaa]">客户端（本地电脑）</span>
      </div>
      <div class="px-3 py-2 space-y-1.5 text-xs">
        <div class="flex justify-between"><span class="text-[#666]">工作目录</span><span class="text-[#bbb] font-mono text-[11px] truncate max-w-[130px]" id="workDir">未设置</span></div>
        <div class="flex justify-between"><span class="text-[#666]">平台</span><span class="text-[#bbb]" id="client平台">-</span></div>
        <div class="flex justify-between"><span class="text-[#666]">主机名</span><span class="text-[#bbb] truncate max-w-[120px]" id="client主机名">-</span></div>
      </div>
      <div class="px-3 py-2 border-t border-[#1f1f1f]">
        <div class="text-[11px] font-medium text-[#777] mb-2">权限模式</div>
        <div class="flex gap-1.5">
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#222] border border-[#333]" id="permSuper" onclick="setPermission('super')">
            <div class="w-1.5 h-1.5 rounded-full bg-[#ededed]"></div>
            <div class="text-[11px] font-medium text-[#ededed]">超级模式</div>
          </div>
          <div class="flex-1 flex items-center gap-1.5 px-2 py-1.5 rounded-lg cursor-pointer transition-all bg-[#1a1a1a] border border-[#222]" id="permWorkspace" onclick="setPermission('workspace')">
            <div class="w-1.5 h-1.5 rounded-full bg-[#444]"></div>
            <div class="text-[11px] font-medium text-[#666]">工作区模式</div>
          </div>
        </div>
      </div>
      <div class="px-3 py-2 text-[10px] text-[#444] text-center border-t border-[#1a1a1a]">会话在左侧边栏管理</div>
    </div>
  </aside>
</div>

<script src="ui.js"></script>

<!-- 配置弹窗 -->
<div id="configModal" class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-300" style="background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; backdrop-filter: blur(4px);">
  <div id="configModalContent" class="rounded-xl bg-[#1a1a1a] border border-[#333] shadow-2xl w-80 transition-all duration-300" style="transform: scale(0.9) translateY(20px); opacity: 0;">
    <div class="px-4 py-3 border-b border-[#222]">
      <span class="text-sm font-medium text-[#ededed]">中转服务器配置</span>
    </div>
    <div class="px-4 py-3 space-y-3">
      <div>
        <label class="text-xs text-[#888] block mb-1">中转服务器地址</label>
        <input type="text" id="modalRelayUrl" class="w-full bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="yunqiao.very.im" />
      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">Key（密钥）</label>
        <input type="text" id="modalRelayKey" class="w-full bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="输入密钥" />
      </div>
    </div>
    <div class="flex gap-2 px-4 py-3 border-t border-[#222]">
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all font-medium" onclick="closeConfigModal()">取消</button>
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveConfigModal()">确定</button>
    </div>
  </div>
</div>  </div>
</div>

<!-- 新建会话弹窗 -->
<div id="sessionModal" class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-300" style="background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; backdrop-filter: blur(4px);">
  <div id="sessionModalContent" class="rounded-xl bg-[#1a1a1a] border border-[#333] shadow-2xl w-80 transition-all duration-300" style="transform: scale(0.9) translateY(20px); opacity: 0;">
    <div class="px-4 py-3 border-b border-[#222]">
      <span class="text-sm font-medium text-[#ededed]">新建工作区</span>
    </div>
    <div class="px-4 py-3 space-y-3">
      <div>
        <label class="text-xs text-[#888] block mb-1">工作区名称</label>
        <input type="text" id="modalSessionName" class="w-full bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="输入名称" />
      </div>
      <div>
        <label class="text-xs text-[#888] block mb-1">工作目录</label>
        <div class="flex gap-2">
          <input type="text" id="modalSessionDir" class="flex-1 bg-[#0d0d0d] border border-[#333] rounded-lg px-3 py-2 text-xs text-[#ededed] outline-none font-mono transition-colors focus:border-[#555]" placeholder="C:\Users\Administrator" />
          <button class="text-xs px-3 py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all" onclick="browseSessionDir(event)">浏览</button>
        </div>
      </div>
    </div>
    <div class="flex gap-2 px-4 py-3 border-t border-[#222]">
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#333] text-[#aaa] hover:bg-[#444] hover:text-[#ededed] transition-all font-medium" onclick="closeSessionModal()">取消</button>
      <button class="flex-1 text-xs py-2 rounded-lg bg-[#ededed] text-[#0a0a0a] hover:bg-white transition-all font-medium" onclick="saveSessionModal()">确定</button>
    </div>
  </div>
</div>
</body>
</html>
