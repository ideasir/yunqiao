<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥 MCP v2.0</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2128;
    --border: #30363d;
    --border-hover: #484f58;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --primary: #f3a04c;
    --primary-glow: rgba(243, 160, 76, 0.25);
    --accent: #e58522;
    --success: #3fb950;
    --success-glow: rgba(63, 185, 80, 0.25);
    --warning: #d29922;
    --danger: #f85149;
    --danger-glow: rgba(248, 81, 73, 0.25);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 标题栏 ── */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .titlebar .logo {
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .titlebar h1 {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .titlebar .status-badge {
    font-size: 11px;
    padding: 3px 12px;
    border-radius: 20px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .titlebar .status-badge.online {
    background: var(--success-glow);
    border-color: var(--success);
    color: var(--success);
  }
  .titlebar .status-badge.offline {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--glass-border);
    color: var(--text3);
  }
  .titlebar button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .titlebar button:hover {
    background: var(--bg3);
    border-color: var(--border-hover);
    color: var(--text);
  }

  /* ── 主体 ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    padding: 8px;
    gap: 8px;
  }

  /* ── 左侧面板 ── */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: row;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    min-width: 0;

  }
    .session-sidebar {
    width: 50px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
  }
  .sidebar-add {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    margin-bottom: 6px;
    border: 1px dashed var(--border);
  }
  .sidebar-add:hover {
    background: rgba(243, 160, 76, 0.1);
    border-color: var(--primary);
  }
  .sidebar-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    flex: 1;
    overflow-y: auto;
    width: 100%;
    padding: 0 8px;
  }
  .sidebar-item {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
    position: relative;
  }
  .sidebar-item:hover {
    color: var(--text);
    background: var(--bg3);
  }
  .sidebar-item.active {
    color: var(--primary);
    background: rgba(243, 160, 76, 0.12);
  }
  .sidebar-item .badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    font-size: 0;
  }
  .sidebar-item .close {
    display: none;
    position: absolute;
    top: -4px;
    right: -4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sidebar-item:hover .close {
    display: flex;
  }

  .session-tab {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    white-space: nowrap;
    user-select: none;
    transition: all 0.2s;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }
  .session-tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .session-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: rgba(243, 160, 76, 0.12);
  }
  .session-tab .close {
    font-size: 14px;
    opacity: 0.3;
    cursor: pointer;
    padding: 0 4px;
    transition: opacity 0.2s;
  }
  .session-tab .close:hover { opacity: 1; color: var(--danger); }
  .session-tab.add-tab {
    color: var(--text3);
    font-size: 20px;
    padding: 6px 10px;
    font-weight: 300;
  }
  .session-tab.add-tab:hover { color: var(--primary); }

  .session-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .session-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--glass-bg2);
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  .session-header .cwd {
    font-size: 12px;
    color: var(--text2);
    font-family: 'Consolas', 'Cascadia Code', monospace;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-header .cwd::before { content: '\01F4C2 '; }
  .session-header .info {
    font-size: 11px;
    color: var(--text3);
  }
  .session-log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.7;
  }
  .session-log .entry {
    padding: 1px 0;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .session-log .entry .time {
    color: var(--text3);
    flex-shrink: 0;
    min-width: 62px;
    font-size: 11px;
  }
  .session-log .entry .msg { flex: 1; word-break: break-all; }
  .session-log .entry .msg pre { margin: 0; font-family: inherit; white-space: pre-wrap; }
  .session-log .entry.cmd .msg { color: #7ec8e3; }       /* 命令 */
  .session-log .entry.out .msg { color: #a8d8a8; }       /* 输出 */
  .session-log .entry.err .msg { color: #f0a0a0; }       /* 错误 */
  .session-log .entry.info .msg { color: var(--text2); }  /* 日志 */
  .session-log .entry.done .msg { color: var(--success); } /* 完成 */
  .session-log .entry.file .msg { color: #c8a8e8; }      /* 文件内容 */
  .session-log .entry.code .msg { color: #e8d8a0; }       /* 代码 */
  .session-log .entry.status .msg { color: var(--warning); } /* 状态 */

  .session-input {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    background: var(--glass-bg2);
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  .session-input input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    font-family: 'Consolas', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .session-input input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

  .session-input input::placeholder { color: var(--text3); }
  .session-input button {
    background: var(--primary);
    border: none;
    color: #fff;
    padding: 7px 18px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .session-input button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--primary-glow); }

  /* ── 右侧面板 ── */
  .right-panel {
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .section {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--glass-shadow);
  }
  .section:last-child { flex: 1; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    background: var(--glass-bg2);
    border-bottom: 1px solid var(--glass-border);
    letter-spacing: 0.5px;
  }
  .section-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .section-header .dot.green { background: var(--success); color: var(--success-glow); }
  .section-header .dot.yellow { background: var(--warning); color: rgba(235, 164, 0, 0.3); }
  .section-header .dot.gray { background: var(--text3); color: transparent; }
  .section-body {
    padding: 10px 14px;
  }
  .field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 12px;
  }
  .field .label { color: var(--text2); }
  .field .value { color: var(--text); font-family: 'Consolas', monospace; font-size: 11px; }
  .field .value.code {
    background: rgba(0, 0, 0, 0.3);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
    color: var(--primary);
    letter-spacing: 3px;
    border: 1px solid var(--glass-border);
  }
  .btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--bg3);
    border-color: var(--border-hover);
    color: var(--text);
  }
  .btn.primary {
    background: var(--primary);
    color: #fff;
    border: none;
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--primary-glow); }
  .btn.danger {
    background: var(--danger);
    color: #fff;
    border: none;
  }
  .btn.danger:hover { transform: translateY(-1px); }
  .btn.success {
    background: var(--success);
    color: #fff;
    border: none;
  }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

  .session-list { margin-top: 6px; }
  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .session-item:hover { background: rgba(255, 255, 255, 0.06); }
  .session-item.active { background: rgba(243, 160, 76, 0.12); border: 1px solid rgba(243, 160, 76, 0.2); }
  .session-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .dir { color: var(--text3); font-size: 10px; }
  .session-item .del { color: var(--text3); cursor: pointer; padding: 0 4px; }
  .session-item .del:hover { color: var(--danger); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--glass-border-hover); }
</style>>

<body>
<div class="titlebar">
  <span class="logo">Y</span>
  <h1>云桥 MCP <span style="font-size:11px;color:var(--text3);font-weight:normal">v2.0</span></h1>
  <span class="status-badge" id="connStatus">初始化中...</span>
  <button onclick="openSettings()">⚙ 设置</button>
</div>

<div class="main">
  <!-- 左侧：会话内容 -->
  <div class="left-panel">
    <div class="session-sidebar" id="sessionSidebar">
      <div class="sidebar-add" onclick="createSession()" title="新建会话">+</div>
      <div class="sidebar-list" id="sidebarList">
      </div>
    </div>
    <div class="session-content">
      <div class="session-header">
        <span class="cwd" id="currentCwd">未设置工作目录</span>
        <span class="info" id="sessionInfo">-</span>
      </div>
      <div class="session-log" id="sessionLog">
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">欢迎使用云桥 MCP v2.0</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">命令/输出/文件内容/日志全部显示在此区域，颜色区分类型</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">🟦 命令 | 🟩 输出 | 🟥 错误 | 🟪 文件 | 🟨 状态 | ⬜ 日志</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">连接客户端后，在下方输入命令</span></div>
      </div>
      <div class="session-input">
        <input type="text" id="cmdInput" placeholder="输入命令或消息，按 Enter 发送" spellcheck="false"
               onkeydown="if(event.key==='Enter')sendCommand()" />
        <button onclick="sendCommand()">发送</button>
      </div>

    </div>
  </div>

  <!-- 右侧：功能区 -->
  <div class="right-panel">
    <!-- 上游 Agent -->
    <div class="section">
      <div class="section-header">
        <span class="dot green" id="agentDot"></span> 上游 Agent
      </div>
      <div class="section-body">
        <div class="field"><span class="label">状态</span><span class="value" id="agentStatus">等待连接</span></div>
        <div class="field"><span class="label">配对码</span><span class="value code" id="pairCode">------</span></div>
        <div class="field"><span class="label">设备</span><span class="value" id="deviceName">-</span></div>
        <div class="btn-group" style="margin-top:6px">
          <button class="btn primary" onclick="copyPairCode()">📋 复制配对码</button>
          <button class="btn" onclick="refreshPairCode()">🔄 刷新</button>
        </div>
      </div>
    </div>

    <!-- 中转服务器 -->
    <div class="section">
      <div class="section-header">
        <span class="dot green" id="relayDot"></span> 中转服务器
      </div>
      <div class="section-body">
        <div class="field"><span class="label">地址</span><span class="value" id="relayUrl">yunqiao.very.im</span></div>
        <div class="field"><span class="label">延迟</span><span class="value" id="relayLatency">-- ms</span></div>
        <div class="field"><span class="label">连接</span><span class="value" id="relayStatus">已连接</span></div>
      </div>
    </div>

    <!-- 客户端 -->
    <div class="section">
      <div class="section-header">
        <span class="dot gray" id="clientDot"></span> 客户端
      </div>
      <div class="section-body">
        <div class="field"><span class="label">工作目录</span>
          <span style="display:flex;gap:4px">
            <span class="value" id="workDir" style="font-size:10px;max-width:140px;overflow:hidden;text-overflow:ellipsis">未设置</span>
            <button class="btn" onclick="browseWorkDir()">📁</button>
          </span>
        </div>
        <div class="field"><span class="label">平台</span><span class="value" id="clientPlatform">-</span></div>
        <div class="field"><span class="label">主机名</span><span class="value" id="clientHostname">-</span></div>
        <div class="session-list" id="sessionList">
          <!-- 会话列表由 JS 动态生成 -->
        </div>
        <div class="btn-group" style="margin-top:4px">
          <button class="btn primary" onclick="createSession()">➕ 新建会话</button>
          <button class="btn" onclick="refreshSessions()">🔄 刷新</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── 状态 ────────────────────────────────────
const state = {
  connected: false,
  pairCode: '------',
  ws: null,
  sessions: [],
  currentSessionId: null,
  deviceId: null,
  deviceName: '',
  cwd: '',
  logs: {},
};

// ─── WebSocket 连接 ─────────────────────────
function connect() {
  const url = `wss://yunqiao.very.im/device`;
  state.ws = new WebSocket(url);
  state.ws.onopen = () => {
    addLog('info', 'WebSocket 已连接');
    setConnStatus('connected');
  };
  state.ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (err) {
      console.error('parse error:', err);
    }
  };
  state.ws.onclose = () => {
    addLog('info', 'WebSocket 已断开，5秒后重连...');
    setConnStatus('disconnected');
    setTimeout(connect, 5000);
  };
  state.ws.onerror = (err) => {
    console.error('ws error:', err);
  };
}

// ─── 消息处理 ───────────────────────────────
function handleMessage(msg) {
  const t = msg.type;
  const p = msg.payload || {};

  if (t === 'register_result' && msg.success) {
    state.deviceId = msg.deviceId;
    addLog('info', `注册成功，设备ID: ${msg.deviceId}`);
  } else if (t === 'agent_connected') {
    addLog('info', 'Agent 已连接');
    document.getElementById('agentDot').className = 'dot green';
    document.getElementById('agentStatus').textContent = '已连接';
  } else if (t === 'agent_disconnected') {
    document.getElementById('agentDot').className = 'dot yellow';
    document.getElementById('agentStatus').textContent = '已断开';
  } else if (t === 'command_result' || t === 'session_op_result') {
    handleCommandResult(msg.requestId, p);
  }
}

function handleCommandResult(rid, p) {
  if (p.exitCode !== undefined) {
    const text = p.stdout || p.stderr || '(无输出)';
    addLog('out', text);
    if (p.exitCode !== 0) addLog('err', `退出码: ${p.exitCode}`);
    else addLog('done', `完成 (退出码: ${p.exitCode})`);
  }
}

// ─── 日志 ────────────────────────────────────
function addLog(type, text) {
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = `entry ${type}`;
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  // 文件内容用 pre 保留格式
  if (type === 'file' || type === 'code') {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">${escapeHtml(text)}</pre></span>`;
  } else {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg">${escapeHtml(text)}</span>`;
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ─── 命令发送 ────────────────────────────────
function sendCommand() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addLog('cmd', `$ ${text}`);
  // 统一发送到服务器，由智能体判断是命令还是消息
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    // 先尝试以命令方式发送
    state.ws.send(JSON.stringify({
      type: 'execute_command',
      requestId: 'cmd_' + Date.now(),
      payload: { command: text, timeout: 30000 },
    }));
    // 同时作为消息发送，让智能体可以回复
    state.ws.send(JSON.stringify({
      type: 'agent_message',
      requestId: 'msg_' + Date.now(),
      text: text,
    }));
  } else {
    try {
      pywebview.api.api_send_command(text);
    } catch(e) {
      addLog('err', '未连接到服务器');
    }
  }
}

// ─── 配对码 ──────────────────────────────────
function copyPairCode() {
  navigator.clipboard.writeText(`云桥 配对码 ${state.pairCode}`);
  addLog('info', '配对码已复制');
}

function refreshPairCode() {
  state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
  document.getElementById('pairCode').textContent = state.pairCode;
  addLog('info', `配对码已刷新: ${state.pairCode}`);
}

// ─── 会话管理 ────────────────────────────────
function createSession() {
  const name = prompt('会话名称（可选）:', '工作区');
  if (name === null) return;
  const dir = prompt('工作目录 (如 C:\\Users\\Administrator):', state.workDir || 'C:\\Users\\Administrator');
  if (dir === null) return;
  // 添加一个临时会话到侧边栏
  const id = 's_' + Date.now().toString(36);
  state.sessions.push({
    id: id,
    name: name || '工作区',
    workDir: dir,
    cwd: dir,
    isDefault: state.sessions.length === 0,
  });
  state.currentSessionId = id;
  state.workDir = dir;
  renderSidebar();
  renderSessions();
  addLog('info', `会话已创建: ${name} (${id})`);
  addLog('info', `工作目录: ${dir}`);
  updateStatus();
}

function refreshSessions() {
  addLog('info', '会话列表已刷新');
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  state.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = `sidebar-item${s.id === state.currentSessionId ? ' active' : ''}`;
    const name = (s.name || '?').slice(0, 2);
    item.title = `${s.name || 'unnamed'} - ${s.workDir || ''}`;
    item.innerHTML = `${name}<span class="close" onclick="event.stopPropagation();closeSession('${s.id}')">✕</span>`;
    item.onclick = () => switchSession(s.id);
    list.appendChild(item);
  });
}

function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  state.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = `session-item${s.id === state.currentSessionId ? ' active' : ''}`;
    item.innerHTML = `
      <span class="name">${s.name || 'unnamed'}</span>
      <span class="dir">${s.workDir || ''}</span>
      <span class="del" onclick="event.stopPropagation();closeSession('${s.id}')">✕</span>`;
    item.onclick = () => switchSession(s.id);
    list.appendChild(item);
  });
}

function switchSession(id) {
  state.currentSessionId = id;
  renderSidebar();
  renderSessions();
  addLog('info', `切换到会话: ${id}`);
}

function closeSession(id) {
  state.currentSessionId = id;
  renderSidebar();
  renderSessions();
  addLog('info', `关闭会话: ${id}`);
}

// ─── 设置弹窗 ────────────────────────────────
function openSettings() {
  // 先从后端获取当前设置
  try {
    pywebview.api.get_settings().then(settings => {
      showSettingsDialog(settings.psk, settings.relayUrl);
    });
  } catch(e) {
    showSettingsDialog('', 'wss://yunqiao.very.im/device');
  }
}

function showSettingsDialog(currentPsk, currentUrl) {
  const psk = prompt('请输入 PSK 密钥:', currentPsk || '');
  if (psk === null) return;
  const url = prompt('中继服务器地址:', currentUrl || 'wss://yunqiao.very.im/device');
  if (url === null) return;
  // 保存设置
  try {
    pywebview.api.save_settings(psk, url).then(r => {
      addLog('info', '设置已保存，请重启应用');
    });
  } catch(e) {
    addLog('info', '设置已保存 (仅限桌面版)');
  }
}

function browseWorkDir() {
  addLog('info', '请在客户端 UI 上选择工作目录');
}

// ─── UI 状态更新 ─────────────────────────────
function setConnStatus(status) {
  const badge = document.getElementById('connStatus');
  if (status === 'connected') {
    badge.textContent = '● 已连接';
    badge.className = 'status-badge online';
  } else {
    badge.textContent = '○ 未连接';
    badge.className = 'status-badge offline';
  }
}

// ─── Bridge 通信（接收 Python 后端消息） ──
function handleBridge(action, data) {
  if (action === 'log') {
    addLog('info', data.text);
  } else if (action === 'command_result') {
    const p = data.payload;
    if (p.exitCode !== undefined) {
      const text = p.stdout || p.stderr || '(无输出)';
      addLog('out', text);
      if (p.exitCode !== 0) addLog('err', `退出码: ${p.exitCode}`);
      else addLog('done', `完成 (退出码: ${p.exitCode})`);
    }
  } else if (action === 'agent_status') {
    const dot = document.getElementById('agentDot');
    const status = document.getElementById('agentStatus');
    if (data.status === 'connected') {
      dot.className = 'dot green';
      status.textContent = '已连接';
    } else {
      dot.className = 'dot yellow';
      status.textContent = '已断开';
    }
  } else if (action === 'relay_status') {
    const dot = document.getElementById('relayDot');
    if (data.status === 'connected') {
      dot.className = 'dot green';
      document.getElementById('relayStatus').textContent = '已连接';
    } else {
      dot.className = 'dot gray';
      document.getElementById('relayStatus').textContent = '未连接';
    }
  }
}

// ─── 发送消息给智能体 ────────────────────────
// ─── 更新状态 ────────────────────────────────
function updateStatus() {
  document.getElementById('pairCode').textContent = state.pairCode;
  document.getElementById('deviceName').textContent = state.deviceName || '-';
  document.getElementById('clientPlatform').textContent = state.platform || '-';
  document.getElementById('clientHostname').textContent = state.hostname || '-';
  document.getElementById('workDir').textContent = state.workDir || '未设置';
}
