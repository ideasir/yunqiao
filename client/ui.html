<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥 MCP v2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        surface: { 50: '#f4f4f8', 100: '#e8e8f0', 200: '#c8c8d8', 300: '#a8a8c0', 400: '#8888a8', 500: '#686890', 600: '#484870', 700: '#2a2a42', 800: '#1a1a2e', 900: '#0f0f1e', 950: '#080810' },
        brand: { 50: '#fdf4f0', 100: '#fae8dc', 200: '#f5d0b8', 300: '#f0b894', 400: '#eb9f6f', 500: '#e8874a', 600: '#d46e2e', 700: '#b05824', 800: '#8c451c', 900: '#683315' },
        accent: { 50: '#f0f0ff', 100: '#dcdcff', 200: '#b8b8ff', 300: '#9494ff', 400: '#7070ff', 500: '#5555ee', 600: '#4444cc', 700: '#3636aa', 800: '#2a2a88', 900: '#1e1e66' },
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a42; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #484870; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glow-line { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
  .animate-pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  .animate-slide-up { animation: slide-up 0.2s ease; }
  .animate-glow { animation: glow-line 3s ease-in-out infinite; }
</style>
</head>
<body class="bg-surface-950 text-surface-100 h-screen flex flex-col overflow-hidden select-none">

<!-- ─── 标题栏 ─── -->
<header class="flex items-center gap-3 px-4 py-2 bg-surface-900 border-b border-surface-700 flex-shrink-0">
  <div class="w-5 h-5 bg-accent-500 rounded flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0">~</div>
  <span class="text-sm font-semibold text-surface-100">云桥 MCP</span>
  <span class="text-xs text-surface-500 font-medium">v2.0</span>
  <div class="flex-1"></div>
  <div class="w-2 h-2 rounded-full bg-surface-500" id="connStatus"></div>
  <button class="text-surface-500 hover:text-surface-200 text-sm px-1 py-0.5 rounded transition-colors" onclick="openSettings()" title="设置">⚙</button>
</header>

<!-- ─── 主体 ─── -->
<div class="flex flex-1 overflow-hidden gap-0">

  <!-- 左侧：终端 -->
  <div class="flex-1 flex flex-col bg-surface-950 min-w-0">
    <!-- 路径栏 -->
    <div class="flex items-center gap-2 px-4 py-1.5 bg-surface-900 border-b border-surface-700 flex-shrink-0">
      <span class="text-accent-500 text-sm font-bold">❯</span>
      <span class="text-xs font-mono text-surface-400 flex-1 truncate" id="currentCwd">~</span>
      <span class="text-xs text-surface-600" id="sessionInfo">-</span>
    </div>

    <!-- 日志区 -->
    <div class="flex-1 overflow-y-auto px-4 py-2 font-mono text-sm leading-relaxed" id="sessionLog">
      <div class="entry info flex gap-2 py-0.5 animate-slide-up"><span class="text-surface-600 flex-shrink-0 text-xs min-w-[56px]">--:--:--</span><span class="text-surface-500">云桥 MCP v2.0 终端版</span></div>
      <div class="entry info flex gap-2 py-0.5 animate-slide-up"><span class="text-surface-600 flex-shrink-0 text-xs min-w-[56px]">--:--:--</span><span class="text-surface-500">输入命令开始操作</span></div>
    </div>

    <!-- 输入区 -->
    <div class="flex items-stretch border-t border-surface-700 flex-shrink-0">
      <span class="flex items-center pl-4 pr-0 text-accent-500 text-sm font-bold select-none">❯</span>
      <input type="text" id="cmdInput" class="flex-1 bg-transparent border-none text-surface-100 px-3 py-2 font-mono text-sm outline-none placeholder-surface-600" placeholder="输入命令..." spellcheck="false" onkeydown="if(event.key==='Enter')sendCommand()" />
    </div>
  </div>

  <!-- 右侧：状态面板 -->
  <aside class="w-56 flex flex-col bg-surface-900 border-l border-surface-700 overflow-y-auto flex-shrink-0 text-sm">
    <!-- Agent -->
    <section class="px-4 py-3 border-b border-surface-700">
      <h3 class="text-xs font-semibold text-surface-500 uppercase tracking-wider mb-2">Agent</h3>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">状态</span><span class="text-surface-300" id="agentStatus">待接入</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">配对码</span><span class="font-mono text-accent-400 font-bold tracking-wider text-base" id="pairCode">------</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">设备</span><span class="text-surface-300 truncate max-w-[120px]" id="deviceName">-</span></div>
      <div class="flex gap-2 mt-2">
        <button class="text-xs px-2.5 py-1 rounded bg-accent-500/10 text-accent-400 border border-accent-500/20 hover:bg-accent-500/20 transition-colors" onclick="copyPairCode()">复制</button>
        <button class="text-xs px-2.5 py-1 rounded bg-surface-800 text-surface-400 border border-surface-700 hover:text-surface-200 hover:border-surface-600 transition-colors" onclick="refreshPairCode()">刷新</button>
      </div>
    </section>

    <!-- Relay -->
    <section class="px-4 py-3 border-b border-surface-700">
      <h3 class="text-xs font-semibold text-surface-500 uppercase tracking-wider mb-2">Relay</h3>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">地址</span><span class="text-surface-300 font-mono text-xs" id="relayUrl">yunqiao.very.im</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">延迟</span><span class="text-surface-300 font-mono" id="relayLatency">-- ms</span></div>
    </section>

    <!-- Client -->
    <section class="px-4 py-3 border-b border-surface-700 flex-1">
      <h3 class="text-xs font-semibold text-surface-500 uppercase tracking-wider mb-2">Client</h3>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">目录</span><span class="text-surface-300 font-mono text-xs truncate max-w-[130px]" id="workDir">未设置</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">平台</span><span class="text-surface-300" id="clientPlatform">-</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-surface-500">主机</span><span class="text-surface-300 truncate max-w-[120px]" id="clientHostname">-</span></div>
      <div class="mt-2 pt-2 border-t border-surface-700" id="sessionList"></div>
      <div class="flex gap-2 mt-2">
        <button class="text-xs px-2.5 py-1 rounded bg-accent-500/10 text-accent-400 border border-accent-500/20 hover:bg-accent-500/20 transition-colors" onclick="createSession()">+ 新建会话</button>
        <button class="text-xs px-2.5 py-1 rounded bg-surface-800 text-surface-400 border border-surface-700 hover:text-surface-200 hover:border-surface-600 transition-colors" onclick="refreshSessions()">↻</button>
      </div>
    </section>
  </aside>
</div>

<script>
// ─── 状态 ────────────────────────────────────
const state = {
  connected: false, pairCode: '------', ws: null,
  sessions: [], currentSessionId: null,
  deviceId: null, deviceName: '', cwd: '',
  logs: {}, platform: '', hostname: '', workDir: '',
};

// ─── 日志 ────────────────────────────────────
function addLog(type, text) {
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = 'entry ' + type + ' flex gap-2 py-0.5 animate-slide-up';
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  const colorMap = {cmd:'text-cyan-400',out:'text-green-400',err:'text-red-400',info:'text-surface-500',done:'text-green-400',file:'text-purple-400',code:'text-yellow-400',status:'text-orange-400'};
  const color = colorMap[type] || 'text-surface-300';
  if (type === 'file' || type === 'code') {
    entry.innerHTML = '<span class="text-surface-600 flex-shrink-0 text-xs min-w-[56px]">' + time + '</span><span class="' + color + '"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">' + escHtml(text) + '</pre></span>';
  } else {
    entry.innerHTML = '<span class="text-surface-600 flex-shrink-0 text-xs min-w-[56px]">' + time + '</span><span class="' + color + '">' + escHtml(text) + '</span>';
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

// ─── 命令发送 ────────────────────────────────
function sendCommand() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addLog('cmd', '$ ' + text);
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'execute_command', requestId: 'cmd_' + Date.now(), payload: { command: text, timeout: 30000 } }));
    state.ws.send(JSON.stringify({ type: 'agent_message', requestId: 'msg_' + Date.now(), text: text }));
  } else {
    try { pywebview.api.api_send_command(text); } catch(e) { addLog('err', '未连接到服务器'); }
  }
}

// ─── 配对码 ──────────────────────────────────
function copyPairCode() {
  navigator.clipboard.writeText('云桥 配对码 ' + state.pairCode);
  addLog('info', '配对码已复制');
}
function refreshPairCode() {
  state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
  document.getElementById('pairCode').textContent = state.pairCode;
  addLog('info', '配对码已刷新: ' + state.pairCode);
}

// ─── 会话管理 ────────────────────────────────
function createSession() {
  const name = prompt('会话名称（可选）:', '工作区');
  if (name === null) return;
  const dir = prompt('工作目录:', state.workDir || 'C:\\Users\\Administrator');
  if (dir === null) return;
  const id = 's_' + Date.now().toString(36);
  state.sessions.push({ id: id, name: name || '工作区', workDir: dir, cwd: dir, isDefault: state.sessions.length === 0 });
  state.currentSessionId = id; state.workDir = dir;
  renderSessions(); updateStatus();
  addLog('info', '会话已创建: ' + name + ' (' + id + ')');
}
function refreshSessions() { addLog('info', '会话列表已刷新'); }
function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  state.sessions.forEach(function(s) {
    const item = document.createElement('div');
    item.className = 'flex items-center gap-1 py-1 px-1 rounded cursor-pointer text-xs transition-colors' + (s.id === state.currentSessionId ? ' bg-accent-500/10 text-accent-400' : ' text-surface-400 hover:text-surface-200 hover:bg-surface-800');
    item.innerHTML = '<span class="flex-1 truncate">' + escHtml(s.name || 'unnamed') + '</span><span class="text-surface-600 hover:text-red-400 cursor-pointer" onclick="event.stopPropagation();closeSession(\'' + s.id + '\')">✕</span>';
    item.onclick = function() { switchSession(s.id); };
    list.appendChild(item);
  });
}
function switchSession(id) {
  state.currentSessionId = id; renderSessions(); addLog('info', '切换到会话: ' + id);
}
function closeSession(id) {
  if (!confirm('确定关闭此会话?')) return;
  state.sessions = state.sessions.filter(function(s) { return s.id !== id; });
  if (state.currentSessionId === id) { state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null; }
  renderSessions(); addLog('info', '会话已关闭: ' + id);
}

// ─── UI 更新 ─────────────────────────────────
function updateStatus() {
  var el;
  el = document.getElementById('pairCode'); if (el) el.textContent = state.pairCode;
  el = document.getElementById('deviceName'); if (el) el.textContent = state.deviceName || '-';
  el = document.getElementById('clientPlatform'); if (el) el.textContent = state.platform || '-';
  el = document.getElementById('clientHostname'); if (el) el.textContent = state.hostname || '-';
  el = document.getElementById('workDir'); if (el) el.textContent = state.workDir || '未设置';
  el = document.getElementById('currentCwd'); if (el) el.textContent = state.workDir || '~';
}
function setConnStatus(status) {
  const dot = document.getElementById('connStatus');
  if (status === 'connected') { dot.className = 'w-2 h-2 rounded-full bg-green-500 animate-pulse-dot'; }
  else { dot.className = 'w-2 h-2 rounded-full bg-surface-500'; }
}

// ─── 初始化 ──────────────────────────────────
(function() {
  refreshPairCode();
  updateStatus();
  addLog('info', '欢迎使用云桥 MCP v2.0');
  setConnStatus('disconnected');
})();
</script>
</body>
</html>
