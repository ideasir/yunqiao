<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>Y</text></svg>">
<title>云桥 MCP v2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
    background: #0a0a0f;
    color: #c0caf5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── 极简标题栏 ── */
  .titlebar {
    display: flex;
    align-items: center;
    padding: 4px 12px;
    background: #0a0a0f;
    border-bottom: 1px solid #1a1a2e;
    flex-shrink: 0;
    gap: 8px;
    user-select: none;
  }
  .titlebar .logo {
    width: 16px; height: 16px;
    background: #7aa2f7;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #0a0a0f;
  }
  .titlebar .title-text { color: #7aa2f7; font-weight: 600; font-size: 12px; }
  .titlebar .title-version { color: #565f89; font-size: 11px; }
  .titlebar .spacer { flex: 1; }
  .titlebar .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #565f89;
  }
  .titlebar .status-dot.online { background: #9ece6a; }
  .titlebar .title-btn {
    background: transparent;
    border: none;
    color: #565f89;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .titlebar .title-btn:hover { color: #c0caf5; background: #1a1a2e; }

  /* ── 主体布局 ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* ── 左侧终端 ── */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0a0a0f;
    min-width: 0;
  }
  .session-header {
    display: flex;
    align-items: center;
    padding: 3px 10px;
    background: #0d0d1a;
    border-bottom: 1px solid #1a1a2e;
    flex-shrink: 0;
    gap: 6px;
  }
  .session-header .cwd {
    font-size: 12px;
    color: #565f89;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-header .cwd::before { content: '❯ '; color: #7aa2f7; }
  .session-header .info { color: #565f89; font-size: 11px; }
  .session-log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    font-size: 13px;
    line-height: 1.6;
  }
  .session-log .entry { padding: 0; display: flex; gap: 8px; }
  .session-log .entry .time { color: #565f89; flex-shrink: 0; min-width: 56px; font-size: 12px; }
  .session-log .entry .msg { flex: 1; word-break: break-all; }
  .session-log .entry .msg pre { margin: 0; font-family: inherit; white-space: pre-wrap; }
  .session-log .entry.cmd .msg { color: #7dcfff; }       /* 命令 - 蓝 */
  .session-log .entry.out .msg { color: #9ece6a; }       /* 输出 - 绿 */
  .session-log .entry.err .msg { color: #f7768e; }       /* 错误 - 红 */
  .session-log .entry.info .msg { color: #565f89; }      /* 日志 - 灰 */
  .session-log .entry.done .msg { color: #9ece6a; }      /* 完成 - 绿 */
  .session-log .entry.file .msg { color: #bb9af7; }      /* 文件 - 紫 */
  .session-log .entry.code .msg { color: #e0af68; }      /* 代码 - 黄 */
  .session-log .entry.status .msg { color: #ff9e64; }    /* 状态 - 橙 */

  /* ── 输入行 ── */
  .session-input {
    display: flex;
    border-top: 1px solid #1a1a2e;
    flex-shrink: 0;
  }
  .session-input .prompt {
    display: flex;
    align-items: center;
    padding: 0 0 0 10px;
    color: #7aa2f7;
    font-size: 14px;
    font-weight: 700;
    user-select: none;
  }
  .session-input input {
    flex: 1;
    background: transparent;
    border: none;
    color: #c0caf5;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .session-input input::placeholder { color: #3b4261; }

  /* ── 右侧面板 ── */
  .right-panel {
    width: 240px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #1a1a2e;
    overflow-y: auto;
    flex-shrink: 0;
    background: #0d0d1a;
  }
  .panel-section {
    padding: 8px 10px;
    border-bottom: 1px solid #1a1a2e;
  }
  .panel-section:last-child { border-bottom: none; flex: 1; }
  .panel-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #565f89;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .panel-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 12px;
  }
  .panel-row .label { color: #565f89; }
  .panel-row .value { color: #c0caf5; }
  .panel-row .value.code {
    color: #7aa2f7;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .panel-btn {
    background: transparent;
    border: 1px solid #1a1a2e;
    color: #565f89;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
  }
  .panel-btn:hover { border-color: #3b4261; color: #c0caf5; }
  .panel-btn.active { background: #7aa2f7; color: #0a0a0f; border-color: #7aa2f7; }
  .panel-btn-group { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

  .session-list-item {
    padding: 3px 4px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .session-list-item:hover { background: #1a1a2e; }
  .session-list-item.active { color: #7aa2f7; }
  .session-list-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .session-list-item .del { color: #565f89; cursor: pointer; }
  .session-list-item .del:hover { color: #f7768e; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #3b4261; }
</style>
</head>
<body>
<div class="titlebar">
  <span class="logo">Y</span>
  <span class="title-text">云桥 MCP</span>
  <span class="title-version">v2.0</span>
  <span class="spacer"></span>
  <span class="status-dot" id="connStatus"></span>
  <button class="title-btn" onclick="openSettings()" title="设置">⚙</button>
</div>

<div class="main">
  <!-- 左侧：会话内容 -->
  <div class="left-panel">
    <div class="session-sidebar" id="sessionSidebar">
      <div class="sidebar-add" onclick="createSession()" title="新建会话"></div>
      <div class="sidebar-list" id="sidebarList">
      </div>
    </div>
    <div class="session-content">
      <div class="session-header">
        <span class="cwd" id="currentCwd">未设置工作目录</span>
        <span class="info" id="sessionInfo">-</span>
      </div>
      <div class="session-log" id="sessionLog">
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">欢迎使用云桥 MCP v2.0</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">命令/输出/文件内容/日志全部显示在此区域，颜色区分类型</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">🟦 命令 | 🟩 输出 | 🟥 错误 | 🟪 文件 | 🟨 状态 | ⬜ 日志</span></div>
        <div class="entry info"><span class="time">--:--:--</span><span class="msg">连接客户端后，在下方输入命令</span></div>
      </div>
      <div class="session-input">
        <input type="text" id="cmdInput" placeholder="输入命令或消息，按 Enter 发送" spellcheck="false"
               onkeydown="if(event.key==='Enter')sendCommand()" />
        <button onclick="sendCommand()">发送</button>
      </div>

    </div>
  </div>

  <!-- 右侧：拓扑图 -->
  <div class="right-panel">
    <div class="topology">
      <canvas id="particleCanvas"></canvas>

      <!-- 上游 Agent -->
      <div class="topo-node" id="nodeAgent">
        <div class="node-header">
          <span class="dot orange" id="agentDot"></span>
          <span>上游 Agent</span>
          <span class="node-badge" id="agentStatus">待接入</span>
        </div>
        <div class="node-body">
          <div class="field"><span class="label">配对码</span><span class="value code" id="pairCode">------</span></div>
          <div class="field"><span class="label">设备</span><span class="value" id="deviceName">-</span></div>
          <div class="btn-group" style="margin-top:4px">
            <button class="btn primary" onclick="copyPairCode()">📋 复制</button>
            <button class="btn" onclick="refreshPairCode()">🔄</button>
          </div>
        </div>
      </div>

      <!-- 连接线 1 (Agent → Relay) -->
      <div class="connector">
        <div class="conn-label" id="connLabel1">SSE 短连接</div>
      </div>

      <!-- 中转服务器 -->
      <div class="topo-node" id="nodeRelay">
        <div class="node-header">
          <span class="dot green" id="relayDot"></span>
          <span>中转服务器</span>
          <span class="node-badge" id="relayStatus">运行中</span>
        </div>
        <div class="node-body">
          <div class="field"><span class="label">地址</span><span class="value" id="relayUrl">yunqiao.very.im</span></div>
          <div class="field"><span class="label">延迟</span><span class="value" id="relayLatency">-- ms</span></div>
        </div>
      </div>

      <!-- 连接线 2 (Relay → Client) -->
      <div class="connector">
        <div class="conn-label" id="connLabel2">WSS 长连接</div>
      </div>

      <!-- 客户端 -->
      <div class="topo-node" id="nodeClient">
        <div class="node-header">
          <span class="dot" id="clientDot"></span>
          <span>客户端</span>
          <span class="node-badge" id="clientStatus">未连接</span>
        </div>
        <div class="node-body">
          <div class="field"><span class="label">工作目录</span><span class="value" id="workDir" style="font-size:10px">未设置</span></div>
          <div class="field"><span class="label">平台</span><span class="value" id="clientPlatform">-</span></div>
          <div class="field"><span class="label">主机名</span><span class="value" id="clientHostname">-</span></div>
          <div class="session-list" id="sessionList"></div>
          <div class="btn-group" style="margin-top:4px">
            <button class="btn primary" onclick="createSession()">+ 新建会话</button>
            <button class="btn" onclick="refreshSessions()">↻</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── 状态 ────────────────────────────────────
const state = {
  connected: false,
  pairCode: '------',
  ws: null,
  sessions: [],
  currentSessionId: null,
  deviceId: null,
  deviceName: '',
  cwd: '',
  logs: {},
};

// ─── WebSocket 连接 ─────────────────────────
function connect() {
  addLog('info', 'HTML 预览模式，使用桌面版连接 WebSocket');
  setConnStatus('disconnected');
}

// ─── 消息处理 ───────────────────────────────
function handleMessage(msg) {
  const t = msg.type;
  const p = msg.payload || {};

  if (t === 'register_result' && msg.success) {
    state.deviceId = msg.deviceId;
    addLog('info', `注册成功，设备ID: ${msg.deviceId}`);
  } else if (t === 'agent_connected') {
    addLog('info', 'Agent 已连接');
    document.getElementById('agentDot').className = 'dot green';
    document.getElementById('agentStatus').textContent = '已连接';
  } else if (t === 'agent_disconnected') {
    document.getElementById('agentDot').className = 'dot yellow';
    document.getElementById('agentStatus').textContent = '已断开';
  } else if (t === 'command_result' || t === 'session_op_result') {
    handleCommandResult(msg.requestId, p);
  }
}

function handleCommandResult(rid, p) {
  if (p.exitCode !== undefined) {
    const text = p.stdout || p.stderr || '(无输出)';
    addLog('out', text);
    if (p.exitCode !== 0) addLog('err', `退出码: ${p.exitCode}`);
    else addLog('done', `完成 (退出码: ${p.exitCode})`);
  }
}

// ─── 日志 ────────────────────────────────────
function addLog(type, text) {
  const log = document.getElementById('sessionLog');
  const entry = document.createElement('div');
  entry.className = `entry ${type}`;
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  // 文件内容用 pre 保留格式
  if (type === 'file' || type === 'code') {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">${escapeHtml(text)}</pre></span>`;
  } else {
    entry.innerHTML = `<span class="time">${time}</span><span class="msg">${escapeHtml(text)}</span>`;
  }
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ─── 命令发送 ────────────────────────────────
function sendCommand() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addLog('cmd', `$ ${text}`);
  // 统一发送到服务器，由智能体判断是命令还是消息
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    // 先尝试以命令方式发送
    state.ws.send(JSON.stringify({
      type: 'execute_command',
      requestId: 'cmd_' + Date.now(),
      payload: { command: text, timeout: 30000 },
    }));
    // 同时作为消息发送，让智能体可以回复
    state.ws.send(JSON.stringify({
      type: 'agent_message',
      requestId: 'msg_' + Date.now(),
      text: text,
    }));
  } else {
    try {
      pywebview.api.api_send_command(text);
    } catch(e) {
      addLog('err', '未连接到服务器');
    }
  }
}

// ─── 配对码 ──────────────────────────────────
function copyPairCode() {
  navigator.clipboard.writeText(`云桥 配对码 ${state.pairCode}`);
  addLog('info', '配对码已复制');
}

function refreshPairCode() {
  state.pairCode = String(100000 + Math.floor(Math.random() * 900000));
  document.getElementById('pairCode').textContent = state.pairCode;
  addLog('info', `配对码已刷新: ${state.pairCode}`);
}

// ─── 会话管理 ────────────────────────────────
function createSession() {
  const name = prompt('会话名称（可选）:', '工作区');
  if (name === null) return;
  const dir = prompt('工作目录 (如 C:\\Users\\Administrator):', state.workDir || 'C:\\Users\\Administrator');
  if (dir === null) return;
  // 添加一个临时会话到侧边栏
  const id = 's_' + Date.now().toString(36);
  state.sessions.push({
    id: id,
    name: name || '工作区',
    workDir: dir,
    cwd: dir,
    isDefault: state.sessions.length === 0,
  });
  state.currentSessionId = id;
  state.workDir = dir;
  renderSidebar();
  renderSessions();
  addLog('info', '点击左侧 + 号新建会话');
  addLog('info', `会话已创建: ${name} (${id})`);
  addLog('info', `工作目录: ${dir}`);
  updateStatus();
}

function refreshSessions() {
  addLog('info', '会话列表已刷新');
}

function renderSidebar() {
  // 终端版无侧边栏，跳过
}

function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  state.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = `session-list-item${s.id === state.currentSessionId ? ' active' : ''}`;
    item.innerHTML = `<span class="name">${s.name || 'unnamed'}</span><span class="del" onclick="event.stopPropagation();closeSession('${s.id}')">✕</span>`;
    item.onclick = () => switchSession(s.id);
    list.appendChild(item);
  });
}

function switchSession(id) {
  state.currentSessionId = id;
  renderSidebar();
  renderSessions();
  addLog('info', `切换到会话: ${id}`);
}

function closeSession(id) {
  if (!confirm('确定关闭此会话?')) return;
  state.sessions = state.sessions.filter(s => s.id !== id);
  if (state.currentSessionId === id) {
    state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null;
  }
  renderSidebar();
  renderSessions();
  addLog('info', `会话已关闭: ${id}`);
}

// ─── 设置弹窗 ────────────────────────────────
function openSettings() {
  // 先从后端获取当前设置
  try {
    pywebview.api.get_settings().then(settings => {
      showSettingsDialog(settings.psk, settings.relayUrl);
    });
  } catch(e) {
    showSettingsDialog('', 'wss://yunqiao.very.im/device');
  }
}

function showSettingsDialog(currentPsk, currentUrl) {
  const psk = prompt('请输入 PSK 密钥:', currentPsk || '');
  if (psk === null) return;
  const url = prompt('中继服务器地址:', currentUrl || 'wss://yunqiao.very.im/device');
  if (url === null) return;
  // 保存设置
  try {
    pywebview.api.save_settings(psk, url).then(r => {
      addLog('info', '设置已保存，请重启应用');
    });
  } catch(e) {
    addLog('info', '设置已保存 (仅限桌面版)');
  }
}

function browseWorkDir() {
  addLog('info', '请在客户端 UI 上选择工作目录');
}

// ─── UI 状态更新 ─────────────────────────────
function setConnStatus(status) {
  const dot = document.getElementById('connStatus');
  if (status === 'connected') {
    dot.className = 'status-dot online';
  } else {
    dot.className = 'status-dot';
  }
}

// ─── Bridge 通信（接收 Python 后端消息） ──
function handleBridge(action, data) {
  if (action === 'log') {
    addLog('info', data.text);
  } else if (action === 'command_result') {
    const p = data.payload;
    if (p.exitCode !== undefined) {
      // 触发粒子动画：向下（命令执行）→ 向上（结果返回）
      if (window.particleTrigger) {
        window.particleTrigger.flowDown();
        setTimeout(() => window.particleTrigger.flowUp(), 500);
      }
      const text = p.stdout || p.stderr || '(无输出)';
      addLog('out', text);
      if (p.exitCode !== 0) addLog('err', `退出码: ${p.exitCode}`);
      else addLog('done', `完成 (退出码: ${p.exitCode})`);
    }
  } else if (action === 'agent_status') {
    const status = document.getElementById('agentStatus');
    if (data.status === 'connected') {
      status.textContent = '● 已连接';
      status.style.color = '#9ece6a';
    } else {
      status.textContent = '○ 未连接';
      status.style.color = '#565f89';
    }
  } else if (action === 'relay_status') {
    const status = document.getElementById('relayStatus');
    if (data.status === 'connected') {
      status.textContent = '已连接';
    } else {
      status.textContent = '未连接';
    }
  }
}

// ─── 发送消息给智能体 ────────────────────────
// ─── 更新状态 ────────────────────────────────
function updateStatus() {
  const pairEl = document.getElementById('pairCode');
  if (pairEl) pairEl.textContent = state.pairCode;
  const devEl = document.getElementById('deviceName');
  if (devEl) devEl.textContent = state.deviceName || '-';
  const platEl = document.getElementById('clientPlatform');
  if (platEl) platEl.textContent = state.platform || '-';
  const hostEl = document.getElementById('clientHostname');
  if (hostEl) hostEl.textContent = state.hostname || '-';
  const workEl = document.getElementById('workDir');
  if (workEl) workEl.textContent = state.workDir || '未设置';
  const cwdEl = document.getElementById('currentCwd');
  if (cwdEl) cwdEl.textContent = state.workDir || '~';
}

// ─── 初始化 ──────────────────────────────────
connect();
refreshPairCode();
// 空状态，无默认会话
updateStatus();
renderSidebar();

setInterval(() => {
  document.getElementById('relayLatency').textContent =
    `${Math.floor(Math.random() * 20 + 5)} ms`;
}, 3000);
// 终端版无粒子动画
</script>
