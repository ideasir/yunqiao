<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云桥 MCP</title>
<style>
:root{--primary:#F3A04C;--accent:#E58522;--background:#F4F4F6;--panel-bg:#FEFDFC;--card-bg:#fff;--success:#40B43E;--warning:#EBA400;--danger:#E6444E;--primary-foreground:#fff;--text-primary:rgba(0,0,0,.8);--text-secondary:rgba(0,0,0,.5);--text-tertiary:rgba(0,0,0,.35);--intensity-4:rgba(0,0,0,.04);--intensity-6:rgba(0,0,0,.06);--intensity-8:rgba(0,0,0,.08);--intensity-12:rgba(0,0,0,.12);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--background:#232324;--panel-bg:#332D28;--card-bg:#2E2E2E;--primary-foreground:#000;--text-primary:rgba(255,255,255,.8);--text-secondary:rgba(255,255,255,.5);--text-tertiary:rgba(255,255,255,.35);--intensity-4:rgba(255,255,255,.04);--intensity-6:rgba(255,255,255,.06);--intensity-8:rgba(255,255,255,.08);--intensity-12:rgba(255,255,255,.12)}}

html,body{width:100%;height:100%;overflow:clip;margin:0;padding:0;position:relative}
body::-webkit-scrollbar{display:none}
.desktop::-webkit-scrollbar{display:none}
*{scrollbar-width:none!important;-ms-overflow-style:none!important;overflow:clip!important}

button{cursor:pointer;font:inherit}
.desktop{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--background);overflow:clip;color:var(--text-primary);display:flex;flex-direction:column}
.titlebar{height:32px;flex:0 0 32px;background:var(--panel-bg);border-bottom:.5px solid var(--intensity-8);display:flex;align-items:center;padding:0 10px;gap:6px;-webkit-app-region:drag;user-select:none}
.app-icon{width:20px;height:20px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;-webkit-app-region:no-drag}
.app-name{font-size:11px;font-weight:600;-webkit-app-region:no-drag}
.window-actions{margin-left:auto;display:flex;gap:4px;-webkit-app-region:no-drag}
.win{width:8px;height:8px;border-radius:50%;background:var(--intensity-12)}
.win.close{background:#e98578}
.content{padding:3px 5px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow:clip}

.headline{display:flex;align-items:center;justify-content:space-between}
.headline h1{font-size:13px;font-weight:600;margin:0}
.connection{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-secondary)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 15%,transparent)}
.dot.gray{background:var(--intensity-12)}
.dot.yellow{background:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 15%,transparent)}
.dot.red{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 15%,transparent)}
.card{background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:8px;padding:9px}
.card-title{font-size:9px;font-weight:600;margin-bottom:4px;color:var(--text-secondary)}
.route{display:grid;grid-template-columns:1fr 12px 1fr 12px 1fr;align-items:center;gap:2px}
.node{min-width:0;background:var(--intensity-4);border-radius:6px;padding:6px 3px;text-align:center}
.node b{font-size:9px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node span{display:block;color:var(--text-secondary);font-size:7px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{text-align:center;color:var(--accent);font-size:10px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px;margin-top:6px;border-top:.5px solid var(--intensity-8)}
.status-name{font-size:10px;font-weight:500}
.status-meta{font-size:8px;color:var(--text-secondary);margin-top:2px}
.badge{font-size:8px;padding:2px 6px;border-radius:999px;white-space:nowrap}
.badge.green{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.badge.gray{color:var(--text-secondary);background:var(--intensity-6)}
.badge.yellow{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,transparent)}
.badge.red{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.metric{background:var(--intensity-4);border-radius:6px;padding:7px}
.metric label{display:block;color:var(--text-secondary);font-size:8px;margin-bottom:3px}
.metric strong{font-size:11px;font-weight:500}
.metric small{display:block;color:var(--text-secondary);font-size:7px;margin-top:2px}
.activity{display:grid;gap:4px}
.activity-row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px;align-items:center}
.activity-time{font-size:7px;color:var(--text-tertiary);font-family:monospace}
.activity-text{font-size:8px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 工具网格 */
.tool-grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;min-height:20px}
.tool-chip{font-size:8px;padding:3px 7px;border-radius:4px;background:var(--intensity-6);color:var(--text-secondary);border:.5px solid var(--intensity-8);white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .2s}
.tool-chip.active{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:var(--primary);color:var(--primary);font-weight:500}
.tool-chip.active .pulse{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulse-blink .8s ease-in-out infinite}
@keyframes pulse-blink{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 50%,transparent)}50%{opacity:.3;box-shadow:0 0 4px 2px color-mix(in srgb,var(--primary) 30%,transparent)}}

/* 工具日志 */
.tool-log{display:grid;gap:3px}
.tool-log-row{display:grid;grid-template-columns:32px minmax(0,1fr);gap:3px;align-items:center}
.tool-log-time{font-size:7px;color:var(--text-tertiary);font-family:monospace}
.tool-log-text{font-size:8px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field label{display:block;font-size:8px;color:var(--text-secondary);margin-bottom:4px}
.input-row{display:flex;gap:4px}
.input{width:100%;height:26px;min-width:0;border:.5px solid var(--intensity-12);border-radius:6px;background:var(--intensity-4);color:var(--text-primary);padding:0 7px;font-size:9px;outline:none}
.input:focus{border-color:var(--primary)}
.btn{height:24px;border-radius:6px;padding:0 7px;font-size:8px;border:.5px solid var(--intensity-8);background:var(--intensity-6);color:var(--text-primary);white-space:nowrap;display:flex;align-items:center;gap:3px}
.btn.primary{border:0;background:var(--primary);color:#fff}
.btn.small{height:22px;font-size:8px;padding:0 6px}
.pair-card{background:color-mix(in srgb,var(--primary) 10%,transparent);border:.5px solid color-mix(in srgb,var(--primary) 24%,transparent);border-radius:8px;padding:9px;margin-top:0}
.pair-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pair-label{font-size:8px;color:var(--text-secondary)}
.pair-code{font:600 18px monospace;letter-spacing:4px;color:var(--accent);margin:3px 0 4px;text-align:center;cursor:pointer;user-select:all}
.pair-hint{font-size:7px;color:var(--text-secondary);line-height:1.35;text-align:center}
.copy-wide{width:100%;height:24px;border:0;border-radius:6px;background:var(--primary);color:#fff;font-size:9px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.copy-wide:hover{opacity:.9}
.log-box{background:#1f2329;border-radius:8px;padding:5px;color:#d6d9df;min-height:30px;flex-shrink:0}
.log-head{display:flex;justify-content:space-between;font-size:7px;color:#9da5b0;margin-bottom:3px}
.log-line{font:7px/1.6 monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-green{color:#83d68a}
.log-yellow{color:#f5b36b}
.log-red{color:#e77070}
.settings-btn{position:absolute;top:8px;right:10px;background:transparent;border:none;color:var(--text-tertiary);font-size:14px;cursor:pointer;z-index:10;-webkit-app-region:no-drag}
.settings-btn:hover{color:var(--text-primary)}
.version{font-size:7px;color:var(--text-tertiary);text-align:center;padding:2px 0}

/* 设置弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--panel-bg);border-radius:10px;padding:16px;width:300px;max-height:400px;overflow-y:auto}
.modal h2{font-size:13px;font-weight:600;margin-bottom:12px}
.modal .field{margin-bottom:10px}
.modal .field label{display:block;font-size:9px;color:var(--text-secondary);margin-bottom:4px}
.modal .input{width:100%;height:28px;font-size:10px}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.modal .btn{height:28px;font-size:9px;padding:0 14px}

/* 空状态 */
.empty{font-size:8px;color:var(--text-tertiary);text-align:center;padding:6px 0}
</style>
</head>
<body>
<div class="desktop">
  <div class="titlebar">
    <div class="app-icon" style="font-size:11px">Y</div>
    <div class="app-name">云桥 MCP</div>
    <div class="window-actions"><i class="win"></i><i class="win"></i><i class="win close"></i></div>
  </div>
  <div class="content" id="content">
    <button class="settings-btn" onclick="openSettings()">⚙</button>

    <!-- 连接状态 -->
    <div class="headline"><h1>连接状态</h1>
      <div class="connection" id="statusBar">
        <i class="dot gray" id="statusDot"></i>
        <span id="statusText">初始化中...</span>
      </div>
    </div>

    <!-- 当前连接拓扑 -->
    <section class="card">
      <div class="card-title">当前连接</div>
      <div class="route">
        <div class="node"><b>本地客户端</b><span id="nodeClient">等待连接</span></div>
        <div class="arrow">›</div>
        <div class="node"><b>中转服务器</b><span id="nodeRelay">未连接</span></div>
        <div class="arrow">›</div>
        <div class="node"><b>上游 Agent</b><span id="nodeAgent">待接入</span></div>
      </div>
      <div class="status-row">
        <div><div class="status-name" id="deviceName">等待连接</div><div class="status-meta" id="latencyText">延迟 -- ms</div></div>
        <span class="badge gray" id="statusBadge">未连接</span>
      </div>
    </section>

    <!-- 指标 -->
    <div class="metrics">
      <div class="metric"><strong id="latencyVal">--</strong><small>最近心跳</small></div>
      <div class="metric"><label>连接模式</label><strong>1 对 1</strong><small>单 Agent</small></div>
    </div>

    <!-- Agent 活动 -->
    <section class="card">
      <div class="card-title">Agent 活动</div>
      <div class="tool-grid" id="toolGrid"></div>
      <div class="tool-log" id="toolLog"><div class="empty">暂无活动</div></div>
    </section>

    <!-- 配对码 -->
    <section class="card">
      <div class="card-title">客户端配对</div>
      <div class="pair-card">
        <div class="pair-head">
          <span class="pair-label">配对码</span>
          <span class="badge gray" id="pairState">待发送</span>
        </div>
        <div class="pair-code" id="codeDisplay" onclick="copyCode()">------</div>
        <div class="pair-hint">将此配对码发给智能体，用于建立连接</div>
        <button class="copy-wide" id="copyBtn" onclick="copyCode()">📋 复制配对码</button>
        <button class="copy-wide" style="background:var(--intensity-8);color:var(--text-primary);margin-top:4px;font-size:8px" onclick="refreshCode()">🔄 重新生成</button>
      </div>
    </section>

    <!-- 日志 -->
    <div class="log-box" id="logBox">
      <div class="log-head"><span>relay.log</span><span id="liveTag">⏹</span></div>
      <div id="logLines"><div class="log-line" style="color:#9da5b0">等待连接...</div></div>
    </div>

    <div class="version">云桥 MCP v1.1.0</div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙ 设置</h2>
    <div class="field"><label>中继服务器地址</label><input class="input" id="cfgRelay" placeholder="例: wss://yunqiao.very.im/device"></div>
    <div class="field"><label>PSK 密钥</label><input class="input" id="cfgPsk" type="password" placeholder="服务端自动生成的密钥"></div>
    <div class="field"><label>设备名称</label><input class="input" id="cfgName" placeholder="例: my-computer"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" id="saveBtn" onclick="saveSettings()">保存并连接</button>
    </div>
  </div>
</div>

<script>
// ─── 后端通信 ────────────────────────────────
const api = window.pywebview ? window.pywebview.api : null;

function pushData(data){
  // 当 pywebview 不可用时，尝试 fetch
  if(!api) console.log('DATA:', data);
}

// ─── 状态更新 ────────────────────────────────
let pairCode = '------';
let statusDot = document.getElementById('statusDot');
let statusText = document.getElementById('statusText');
let statusBadge = document.getElementById('statusBadge');

function updateStatus(s){
  // s: {connected, latency, status, error}
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const badge = document.getElementById('statusBadge');
  const latVal = document.getElementById('latencyVal');
  const latText = document.getElementById('latencyText');

  if(s.connected){
    dot.className = 'dot green';
    text.textContent = '已连接';
    badge.className = 'badge green';
    badge.textContent = '已接入';
    document.getElementById('nodeAgent').textContent = '已接入';
    if(s.latency){
      latVal.textContent = s.latency + ' ms';
      latText.textContent = '延迟 ' + s.latency + ' ms';
    }
  } else if(s.status === 'connecting'){
    dot.className = 'dot yellow';
    text.textContent = '连接中...';
    badge.className = 'badge yellow';
    badge.textContent = '连接中';
  } else if(s.status === 'reconnecting'){
    dot.className = 'dot yellow';
    text.textContent = '重连中...';
    badge.className = 'badge yellow';
    badge.textContent = '重连中';
  } else {
    dot.className = 'dot gray';
    text.textContent = s.error ? '错误: ' + s.error : '未连接';
    badge.className = 'badge gray';
    badge.textContent = '未连接';
  }
}

function updateLog(data){
  const box = document.getElementById('logLines');
  if(data.logs && data.logs.length){
    box.innerHTML = data.logs.map(l =>
      `<div class="log-line"><span class="log-${l.l.toLowerCase()}">${l.l}</span> ${l.m}</div>`
    ).join('');
    document.getElementById('liveTag').textContent = '● LIVE';
  }
}

function updateActivity(data){
  const grid = document.getElementById('toolGrid');
  const log = document.getElementById('toolLog');

  // 工具网格 — 并排显示当前活跃/最近工具
  if(data.tools && data.tools.length){
    grid.innerHTML = data.tools.map(t => {
      const isActive = t.active;
      return `<div class="tool-chip${isActive?' active':''}">${isActive?'<i class="pulse"></i>':''}${t.name}</div>`;
    }).join('');
  } else {
    grid.innerHTML = '';
  }

  // 活动日志
  if(data.activities && data.activities.length){
    log.innerHTML = data.activities.map(a =>
      `<div class="tool-log-row"><span class="tool-log-time">${a.t}</span><span class="tool-log-text">${a.d}</span></div>`
    ).join('');
  } else {
    log.innerHTML = '<div class="empty">暂无活动</div>';
  }
}

function updatePaired(data){
  if(data.deviceId){
    document.getElementById('nodeAgent').textContent = '已接入';
    document.getElementById('pairState').className = 'badge green';
    document.getElementById('pairState').textContent = '已配对';
  }
}

// ─── 前端接收推送 ────────────────────────────
window.__push = function(cmd, data){
  switch(cmd){
    case 'status': updateStatus(data); break;
    case 'log': updateLog(data); break;
    case 'activity': updateActivity(data); break;
    case 'paired': updatePaired(data); break;
  }
};

// ─── 配对码 ──────────────────────────────────
function copyCode(){
  const code = document.getElementById('codeDisplay').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).catch(()=>{});
  }
  document.getElementById('pairState').textContent = '已复制';
  document.getElementById('pairState').className = 'badge green';
  document.getElementById('copyBtn').textContent = '✅ 已复制';
  setTimeout(()=>{
    document.getElementById('pairState').textContent = '待发送';
    document.getElementById('pairState').className = 'badge gray';
    document.getElementById('copyBtn').textContent = '📋 复制配对码';
  }, 2000);
}

function refreshCode(){
  if(api){
    api.refresh_code().then(r => {
      if(r.pairCode){
        document.getElementById('codeDisplay').textContent = r.pairCode;
        pairCode = r.pairCode;
      }
    });
  }
}

// ─── 设置 ────────────────────────────────────
function openSettings(){
  if(api){
    api.get_initial().then(cfg => {
      document.getElementById('cfgRelay').value = cfg.relayUrl || '';
      document.getElementById('cfgPsk').value = cfg.psk || '';
      document.getElementById('cfgName').value = cfg.deviceName || '';
    });
  }
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings(){
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings(){
  const relay = document.getElementById('cfgRelay').value.trim();
  const psk = document.getElementById('cfgPsk').value.trim();
  const name = document.getElementById('cfgName').value.trim() || 'my-computer';
  if(!relay || !psk){ alert('请填写中继地址和 PSK'); return; }
  if(!api){ alert('后端未就绪，请稍后重试'); return; }
  document.getElementById('saveBtn').textContent = '保存中...';
  document.getElementById('saveBtn').disabled = true;
  api.save_config(psk, relay, name).then(function(r){
    if(r && r.ok){
      api.start_connect().then(function(){
        document.getElementById('deviceName').textContent = name;
        document.getElementById('nodeClient').textContent = 'PSK 已配置';
        closeSettings();
      });
    }
  }).catch(function(e){
    alert('保存失败: ' + (e.message || '未知错误'));
    document.getElementById('saveBtn').textContent = '保存并连接';
    document.getElementById('saveBtn').disabled = false;
  });
}

// ─── 初始化 ──────────────────────────────────
(function init(){
  if(api){
    api.get_initial().then(cfg => {
      if(cfg.pairCode){
        document.getElementById('codeDisplay').textContent = cfg.pairCode;
        pairCode = cfg.pairCode;
      }
      if(cfg.psk){
        document.getElementById('nodeClient').textContent = 'PSK 已配置';
      }
      if(cfg.deviceName){
        document.getElementById('deviceName').textContent = cfg.deviceName;
      }
      // 自动连接
      if(cfg.psk && cfg.relayUrl){
        api.start_connect();
      }
    });
  }
})();
</script>
</body>
</html>
